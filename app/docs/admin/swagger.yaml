          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: database_error | internal_error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAccessToken: []
      summary: Update Signals Routing Config
      tags:
      - Signals Routing
  /api/admin/signal-types/{signal_type_slug}/v{sem_ver}/schema/refresh:
    post:
      description: |-
        Updates the schema of an existing signal type version in place, without creating a new version: the schema file is fetched again from the signal type's schema_url.

        The schema is stored when the signal type version is registered, so changes to the schema file on GitHub are not used until the schema is refreshed.
        To change the schema, update the file on GitHub (GitHub keeps the history of the file) and then call this endpoint.

        Use with caution - replacing a schema with an incompatible version will break existing integrations - if in doubt, register a new schema instead and ask clients to migrate.

        As a safety check, the most recent 1000 signal versions are validated against the new schema.

        If the signal type has a routing config, the routing field must be defined in the new schema.

        Schemas can only be replaced for json and event signal types.

        Note: this endpoint can only be used by site admins
      parameters:
      - description: signal type slug
        example: sample-signal-type
        in: path
        name: signal_type_slug
        required: true
        type: string
      - description: version
        example: 1.0.0
        in: path
        name: sem_ver
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.RefreshSignalTypeSchemaResponse'
        "400":
          description: malformed_body | invalid_request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: authorization_error | access_token_expired
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: resource_not_found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: database_error | internal_error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAccessToken: []
      summary: Refresh a Schema
      tags:
      - Signal Types
