paths:
  /api/admin/accounts/{account_id}/disable:
    post:
      description: |-
        **Use Cases:**
        - **Security Incident**: Compromised account needs immediate lockout
        - **Employee Departure**: Remove access for departed staff

        **Actions Performed:**
        - Sets `is_active = false` (account becomes unusable)
        - Revokes all client secrets/one-time secrets (service accounts)
        - Revokes all refresh tokens (web users)

        If an admin account is disables, it loses access to the admin endpoints straight away. Access tokens that were already issued remain valid on the other endpoints until they expire (up to 30 minutes).

        **Recovery:** Account must be re-enabled by admin via `POST /api/admin/accounts/{account_id}/enable`
        Service accounts will also need a new client secret via `/api/auth/service-accounts/reissue-credentials`

        Only site admins can disable accounts (disabling an account removes its access to every ISN it belongs to).

        ISN admins remove an account from their own ISN by revoking its ISN access.
      parameters:
      - description: Account ID to disable
        example: a38c99ed-c75c-4a4a-a901-c9485cf93cf3
        in: path
        name: account_id
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: invalid_url_param
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: authorization_error | access_token_expired
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: resource_not_found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: database_error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAccessToken: []
      summary: Disable an Account
      tags:
      - Account Management
  /api/admin/accounts/{account_id}/enable:
    post:
      description: |-
        **Administrative endpoint to re-enable previously disabled accounts.**
        Sets account status to `is_active = true` (does not create new tokens).

        **Post-Enable Steps Required:**
        - **Service Accounts**: will need a new client secret via `/api/auth/service-accounts/reissue-credentials`
        - **Web Users**: Can immediately log in again via `/api/auth/login`

        Only site admins can enable accounts.
      parameters:
      - description: Account ID to enable
        example: a38c99ed-c75c-4a4a-a901-c9485cf93cf3
        in: path
        name: account_id
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: invalid_url_param
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: authorization_error | access_token_expired
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: resource_not_found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: database_error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAccessToken: []
      summary: Enable an Account
      tags:
      - Account Management
  /api/admin/accounts/{account_id}/isn-admin-role:
    delete:
      description: |-
        The account reverts to the member role.

        The admin endpoints use the new role straight away. The UI shows or hides the admin pages when the account next gets an access token (up to 30 minutes later).

        **This endpoint can only be used by site admin accounts**
      parameters:
      - description: account id
        example: a38c99ed-c75c-4a4a-a901-c9485cf93cf3
        in: path
        name: account_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: invalid_request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: authorization_error | access_token_expired
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: resource_not_found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: database_error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAccessToken: []
      summary: Revoke ISN Admin Role
      tags:
      - Account Management
    put:
      description: |-
        This endpoint grants the ISN admin role to a site member

        An ISN admin can:
        - Create an ISN
        - Add signal_types to their own ISNs
        - read/write to their own ISNs
        - Grant other accounts read or write access to their ISNs

        Note that ISN admins can't change ISNs they don't own (a site admin must use the `transfer ownership` endpoint if this is required)

        An ISN admin also has access to the following site-level functions:
        - Create service accounts
        - View all users and their email addresses

        Account management (enabling and disabling accounts, password reset links and reissuing service account credentials) is done by site admins, since it affects the account on every ISN it belongs to.

        The admin endpoints use the new role straight away. The UI shows or hides the admin pages when the account next gets an access token (up to 30 minutes later).

        **This endpoint can only be used by site admin accounts**
      parameters:
      - description: account id
        example: a38c99ed-c75c-4a4a-a901-c9485cf93cf3
        in: path
        name: account_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: invalid_request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: authorization_error | access_token_expired
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: resource_not_found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: database_error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAccessToken: []
      summary: Grant ISN Admin Role
      tags:
      - Account Management
  /api/admin/accounts/{account_id}/site-admin-role:
    delete:
      description: |-
        The account reverts to the member role.

        The admin endpoints use the new role straight away. The UI shows or hides the admin pages when the account next gets an access token (up to 30 minutes later).

        **This endpoint can only be used by site admin accounts**
      parameters:
      - description: account id
        example: a38c99ed-c75c-4a4a-a901-c9485cf93cf3
        in: path
        name: account_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: invalid_request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: authorization_error | access_token_expired
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: resource_not_found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: database_error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAccessToken: []
      summary: Revoke Site Admin Role
      tags:
      - Account Management
    put:
      description: |-
        This endpoint grants the site admin role to a user.

        A site admin can create and manage any ISN and administer accounts on the site.

        The following tasks can only be performed by site admins:
        - Create new signal types on the site
        - Register new signal type schemas
        - Transfer ISN ownership between accounts
        - Assign the site admin role to other users

        The admin endpoints use the new role straight away. The UI shows or hides the admin pages when the account next gets an access token (up to 30 minutes later).

        **This endpoint can only be used by site admin accounts**
      parameters:
      - description: account id
        example: a38c99ed-c75c-4a4a-a901-c9485cf93cf3
        in: path
        name: account_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: invalid_request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: authorization_error | access_token_expired
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: resource_not_found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: database_error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAccessToken: []
      summary: Grant Site Admin Role
      tags:
      - Account Management
  /api/admin/isn/{isn_slug}/transfer-ownership:
    put:
      description: |-
        Transfer ownership of an ISN to another admin account.
        This can be used when an admin leaves or when reorganizing responsibilities.
        Only site admins can transfer ISN ownership.
      parameters:
      - description: ISN slug
        example: sample-isn
        in: path
        name: isn_slug
        required: true
        type: string
      - description: Transfer details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.TransferIsnOwnershipRequest'
      responses:
        "200":
          description: OK
        "400":
          description: malformed_body | invalid_request
