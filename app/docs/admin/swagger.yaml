  auth.AccessTokenResponse:
    properties:
      access_token:
        description: AccessToken is a JWT access token containing claims about the
          account and its permissions (see Claims struct)
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..03SEhY_tL2dbNjMYTHka_-5DhR5FhNh0CI0etsQiEo8
        type: string
      account_id:
        description: AccountID is the account id of the user making the request
        example: a38c99ed-c75c-4a4a-a901-c9485cf93cf3
        type: string
      account_type:
        description: AccountType is the account type of the user making the request
          (user or service_account)
        enum:
        - user
        - service_account
        type: string
      email:
        description: email is the contact email for the account
        type: string
      expires_in:
        description: ExpiresIn is the token expiry in seconds
        example: 1800
        type: integer
      isn_perms:
        additionalProperties:
          $ref: '#/definitions/auth.IsnPerm'
        description: IsnPerms is a map of the ISNs the account has access to and the
          permissions granted (the map key is the isn_slug)
        type: object
      role:
        description: Role is the role of the user making the request (siteadmin, isnadmin,
          member)
        enum:
        - siteadmin
        - isnadmin
        - member
        example: isnadmin
        type: string
      token_type:
        description: TokenType (Bearer) - used as a prompt for the client to use the
          Bearer token type when making requests
        example: Bearer
        type: string
    type: object
  auth.IsnPerm:
    properties:
      can_administer:
        description: CanAdminister is true if the account is the owner of the isn
          or a site admin
        example: false
        type: boolean
      can_read:
        description: CanRead is true if the account has read access to the isn
        example: true
        type: boolean
      can_write:
        description: CanWrite is true if the account has write access to the isn
        example: false
        type: boolean
      in_use:
        description: InUse is true if the isn is active
        example: true
        type: boolean
      signal_types:
        additionalProperties:
          $ref: '#/definitions/auth.SignalType'
        description: SignalTypes is a map of the signal type paths to the signal type
