          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: database_error | internal_error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAccessToken: []
      summary: Create Signal Type
      tags:
      - Signal Types
