      - BearerAccessToken: []
      summary: Get Signals Routing Config
      tags:
      - Signals Routing
    put:
      description: |-
        Replaces the route config for the specified signal type path

        the routing_field must be a plain Dot Notation path that is defined in the signal type's schema -
        field names can only contain letters, digits, '_', '-', ':' and '@' (e.g. JSON-LD keys such as location.@value) and are always matched literally.
        Empty path segments and numeric (array index) path segments are not allowed.

        When using the 'matches' and 'does_not_match' operators, any occurrence of '*' and '?' in the matching pattern will be treated as a wildcard ('equals' and 'does_not_equal' compare the pattern literally).
        The pattern is always compared to the full contents of the specified routing field.

        Patterns are matched in order according to the supplied sequence number (smallest sequence first)
        and the first match is accepted. Each rule must have a different sequence number.
        Where the routing field is an array, the rule matches if one or more elements match
        (for 'does_not_match' and 'does_not_equal', if one or more elements do not match the pattern).

        The new config is used immediately by the instance that handled the request, and by the other instances of the service within 30 seconds.
