    get:
      description: "Only site admins and ISN admins can view service account lists.\n\nTo
        return a specific service account supply one of the following query parameter
        combinations:\n-\tid (account ID)\n-\tclient_id\n-\tclient_email & client_organization\n\nNo
        query parameters = return all service accounts\n"
      parameters:
      - description: Service Account ID
        example: a38c99ed-c75c-4a4a-a901-c9485cf93cf3
        in: query
        name: id
        type: string
      - description: Service Account Client ID
        example: sa_exampleorg_k7j2m9x1
        in: query
        name: client_id
        type: string
      - description: Service Account Contact Email (must be used with client_organization)
        example: contact@example.com
        in: query
        name: client_email
        type: string
      - description: Service Account Organization (must be used with client_email)
