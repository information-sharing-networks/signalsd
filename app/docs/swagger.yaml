consumes:
- application/json
definitions:
  apperrors.ErrorCode:
    enum:
    - access_token_expired
    - all_signals_failed_processing
    - authentication_error
    - authorization_error
    - client_closed
    - database_error
    - forbidden
    - invalid_correlation_id
    - internal_error
    - invalid_request
    - invalid_url_param
    - malformed_body
    - not_implemented
    - network_error
    - password_too_short
    - refresh_token_invalid
    - request_too_large
    - unsupported_media_type
    - rate_limit_exceeded
    - resource_already_exists
    - resource_expired
    - resource_in_use
    - resource_not_found
    - timeout
    - token_creation_failed
    type: string
    x-enum-varnames:
    - ErrCodeAccessTokenExpired
    - ErrCodeAllSignalsFailedProcessing
    - ErrCodeAuthenticationFailure
    - ErrCodeAuthorizationFailure
    - ErrCodeClientClosed
    - ErrCodeDatabaseError
    - ErrCodeForbidden
    - ErrCodeInvalidCorrelationID
    - ErrCodeInternalError
    - ErrCodeInvalidRequest
    - ErrCodeInvalidURLParam
    - ErrCodeMalformedBody
    - ErrCodeNotImplemented
    - ErrCodeNetworkError
    - ErrCodePasswordTooShort
    - ErrCodeRefreshTokenInvalid
    - ErrCodeRequestTooLarge
    - ErrCodeUnsupportedMediaType
    - ErrCodeRateLimitExceeded
    - ErrCodeResourceAlreadyExists
    - ErrCodeResourceExpired
    - ErrCodeResourceInUse
    - ErrCodeResourceNotFound
    - ErrCodeTimeout
    - ErrCodeFailedToCreateToken
  auth.AccessTokenResponse:
    properties:
      access_token:
        description: AccessToken is a JWT access token containing claims about the
          account and its permissions (see Claims struct)
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..03SEhY_tL2dbNjMYTHka_-5DhR5FhNh0CI0etsQiEo8
        type: string
      account_id:
        description: AccountID is the account id of the user making the request
        example: a38c99ed-c75c-4a4a-a901-c9485cf93cf3
        type: string
      account_type:
        description: AccountType is the account type of the user making the request
          (user or service_account)
        enum:
        - user
        - service_account
        type: string
      email:
        description: email is the contact email for the account
        type: string
      expires_in:
        description: ExpiresIn is the token expiry in seconds
        example: 1800
        type: integer
      isn_perms:
        additionalProperties:
          $ref: '#/definitions/auth.IsnPerm'
        description: IsnPerms is a map of the ISNs the account has access to and the
          permissions granted (the map key is the isn_slug)
        type: object
      role:
        description: Role is the role of the user making the request (siteadmin, isnadmin,
          member)
        enum:
        - siteadmin
        - isnadmin
        - member
        example: isnadmin
        type: string
      token_type:
        description: TokenType (Bearer) - used as a prompt for the client to use the
          Bearer token type when making requests
        example: Bearer
        type: string
    type: object
  auth.IsnPerm:
    properties:
      can_administer:
        description: CanAdminister is true if the account is the owner of the isn
          or a site admin
        example: false
        type: boolean
      can_read:
        description: CanRead is true if the account has read access to the isn
        example: true
        type: boolean
      can_write:
        description: CanWrite is true if the account has write access to the isn
        example: false
        type: boolean
      in_use:
        description: InUse is true if the isn is active
        example: true
        type: boolean
      signal_types:
        additionalProperties:
          $ref: '#/definitions/auth.SignalType'
        description: SignalTypes is a map of the signal type paths to the signal type
          details (key is the signal type path)
        type: object
      visibility:
        description: Visibility is the ISN visibility setting (public or private)
        enum:
        - public
        - private
        example: private
        type: string
    type: object
  auth.SignalType:
    properties:
      in_use:
        description: InUse is true if the signal type is active. Note this will always
          be false if the parent ISN has been marked as 'not in use'
        example: true
        type: boolean
      path:
        description: |-
          Path is the signal type path in the format "slug/v{version}"
          This is the key used in the SignalTypes map in IsnPerms
        example: sample-signal/v0.0.1
        type: string
      readme_url:
        description: ReadmeURL is the URL of the signal type readme
        example: https://github.com/user/project/blob/main/sample-signal-type/2025-01-01/readme.md
        type: string
      schema_url:
        description: SchemaURL is the URL of the signal type schema
        example: https://github.com/user/project/blob/main/sample-signal-type/2025-01-01/schema.json
        type: string
      sem_ver:
        description: SemVer is the signal type version (e.g. 0.0.1)
        example: 0.0.1
        type: string
      slug:
        description: Slug is the signal type slug (unique per site)
        example: sample-signal
        type: string
    type: object
  handlers.BatchStatus:
    properties:
      isn_slug:
        description: IsnSlug is empty for signals the signal router could not route
          to an ISN
        example: sample-isn
        type: string
      rejected_count:
        description: RejectedCount is the number of unresolved failures
        example: 1
        type: integer
      signal_type_slug:
        example: sample-signal-type
        type: string
      signal_type_version:
        description: SignalTypeVersion is the signal type's sem_ver with a "v" prefix
        example: v1.0.0
        type: string
      stored_count:
        description: StoredCount is the number of signal versions stored in this batch
        example: 10
        type: integer
      unresolved_failures:
        description: UnresolvedFailures lists the signals that failed in this batch
          and have not been stored since
        items:
          $ref: '#/definitions/handlers.FailureRow'
        type: array
    type: object
  handlers.BatchStatusResponse:
    properties:
      account_id:
        type: string
      batch_id:
        type: string
      batch_ref:
        type: string
      batch_status:
        items:
          $ref: '#/definitions/handlers.BatchStatus'
        type: array
      contains_failures:
        type: boolean
      created_at:
        type: string
    type: object
  handlers.CreateSignalsRequest:
    properties:
      batch_ref:
        description: 'BatchRef is a sender-chosen label used to track requests with
          Get Batch Status (1-128 characters: letters, numbers, hyphens and underscores
          only)'
        example: daily-sync-2026-04-02
        type: string
      signals:
        description: Signals - the list of signals to be loaded
        items:
          $ref: '#/definitions/handlers.SubmittedSignal'
        type: array
    type: object
  handlers.CreateSignalsSummary:
    properties:
      rejected_count:
        description: RejectedCount is the count of records rejected due to issues
          with the contents of the record
        example: 1
        type: integer
      stored_count:
        description: StoredCount is the count of records successfully loaded
        example: 1
        type: integer
      total_submitted:
        description: |-
          TotalSubmitted is the count of all the signals supplied in the request
          StoredCount+RejectedCount+UnroutableCount = TotalSubmitted
        example: 3
        type: integer
      unroutable_count:
        description: |-
          UnroutableCount is the count of signals sent to the Signal Router that could not be routed.
          (because the signal failed schema validation, its correlation_id was not found, or no routing rule matched the data)

          This field is only supplied in responses to the Signals Router handler, and is omitted when it is zero.
        example: 1
        type: integer
    type: object
  handlers.CreateUserRequest:
    properties:
      email:
        example: example@example.com
        type: string
      password:
        description: passwords must be at least 11 characters long
        example: lkIB53@6O^Y
        type: string
    type: object
  handlers.DocumentUploadResponse:
    properties:
      batch_ref:
        example: daily-sync-2026-04-02
        type: string
      isn_slug:
        description: the ISN the document was stored on
        example: sample-isn
        type: string
      local_ref:
        example: bol-2026-0042
        type: string
      mime_type:
        description: MimeType is the type of document, detected from its content (application/pdf,
          image/jpeg, image/png or text/xml)
        example: application/pdf
        type: string
      name:
        description: Name is the file name supplied when the document was uploaded
          (its extension must match the mime type)
        example: BL-2026-0042.pdf
        type: string
      sha256:
        description: SHA256 is the sha256 hash of the document as lowercase hex (computed
          by the server when the document is uploaded)
        example: 2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824
        type: string
      signal_id:
        example: b8ded113-ac0e-4a2c-a89f-0876fe97b440
        type: string
      signal_version_id:
        example: 835788bd-789d-4091-96e3-db0f51ccbabc
        type: string
      size_bytes:
        description: SizeBytes is the size of the document in bytes (measured by the
          server when the document is uploaded)
        example: 482133
        type: integer
      unchanged:
        description: true if the file and filename are the same as the latest version,
          in which case that version is returned and no new version is created
        example: false
        type: boolean
      version_number:
        example: 1
        type: integer
    type: object
  handlers.FailedSignal:
    properties:
      error_code:
        example: malformed_body
        type: string
      error_message:
        example: field 'name' is required
        type: string
      local_ref:
        example: item_id_#2
        type: string
    type: object
  handlers.FailureRow:
    properties:
      error_code:
        type: string
      error_message:
        type: string
      local_ref:
        type: string
    type: object
  handlers.Isn:
    properties:
      created_at:
        example: "2025-06-03T13:47:47.331787+01:00"
        type: string
      detail:
        example: Sample ISN description
        type: string
      id:
        example: 67890684-3b14-42cf-b785-df28ce570400
        type: string
      is_in_use:
        description: IsInUse is false if the ISN has been disabled
        example: true
        type: boolean
      owner_account_id:
        description: OwnerAccountID is the account ID of the admin that owns the ISN
        example: a38c99ed-c75c-4a4a-a901-c9485cf93cf3
        type: string
      slug:
        description: Slug is the URL-friendly identifier generated from the title
        example: sample-isn
        type: string
      title:
        example: Sample ISN @example.org
        type: string
      updated_at:
        example: "2025-06-03T13:47:47.331787+01:00"
        type: string
      visibility:
        description: Visibility is private (signals visible to ISN members only) or
          public (signals visible to anyone)
        enum:
        - public
        - private
        example: private
        type: string
    type: object
  handlers.IsnAndLinkedInfo:
    properties:
      isn:
        $ref: '#/definitions/handlers.Isn'
      signal_types:
        description: SignalTypes lists the signal types registered on the ISN (omitted
          if there are none)
        items:
          $ref: '#/definitions/handlers.SignalType'
        type: array
    type: object
  handlers.IsnResult:
    properties:
      failed_signals:
        description: Failed Signals is the list of signals that could not be loaded
          to the target ISN
        items:
          $ref: '#/definitions/handlers.FailedSignal'
        type: array
      isn_slug:
        description: IsnSlug is the target ISN
        example: sample-isn
        type: string
      signal_type_path:
        description: SignalTypePath is the target Signal Type
        example: signal-type-1/v0.0.1
        type: string
      stored_signals:
        description: StoredSignals is the list of signals successfully processed
        items:
          $ref: '#/definitions/handlers.StoredSignal'
        type: array
    type: object
  handlers.IsnSignalTypeDetail:
    properties:
      content_kind:
        enum:
        - json
        - document
        - event
        example: json
        type: string
      created_at:
        example: "2025-06-03T13:47:47.331787+01:00"
        type: string
      detail:
        example: Sample signal type description
        type: string
      id:
        example: 67890684-3b14-42cf-b785-df28ce570400
        type: string
      is_in_use:
        description: whether the signal type is enabled on this ISN
        example: true
        type: boolean
      readme_url:
        example: https://github.com/user/project/blob/main/sample-signal-type/2025-01-01/readme.md
        type: string
      schema_url:
        example: https://github.com/user/project/blob/main/sample-signal-type/2025-01-01/schema.json
        type: string
      sem_ver:
        example: ""
        type: string
      slug:
        example: sample-signal-type
        type: string
      title:
        example: Sample Signal Type
        type: string
      updated_at:
        example: "2025-06-03T13:47:47.331787+01:00"
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        example: example@example.com
        type: string
      password:
        description: passwords must be at least 11 characters long
        example: lkIB53@6O^Y
        type: string
    type: object
  handlers.PreviousSignalVersion:
    properties:
      content:
        description: the content of this version (the json payload, or the document
          metadata for documents)
        type: object
      created_at:
        description: when this version was received
        example: "2026-09-27T14:02:00.123456Z"
        type: string
      signal_version_id:
        description: the server generated ID of this version
        example: 835788bd-789d-4091-96e3-db0f51ccbabc
        type: string
      version_number:
        description: the version number of this version
        example: 1
        type: integer
    type: object
  handlers.SearchSignal:
    properties:
      account_id:
        description: the account that sent the signal
        example: a38c99ed-c75c-4a4a-a901-c9485cf93cf3
        type: string
      account_type:
        description: the type of account that sent the signal
        enum:
        - user
        - service_account
        example: service_account
        type: string
      content:
        description: 'the signal content: the json payload for json signals and events,
          or the document metadata (name, mime_type, size_bytes and sha256) for documents'
        type: object
      content_kind:
        description: 'how the content is sent and stored: json (the content is the
          signal), document (the content is the document metadata - the document is
          downloaded from the content endpoint) or event (the content is the event,
          including occurred_at)'
        enum:
        - json
        - document
        - event
        example: json
        type: string
      correlation_id:
        description: |-
          the signal_id of the signal this signal is linked to (the correlation_id it was submitted with). Null if the signal is not linked to another signal.
          To fetch the linked signal, use GET /api/signals/search?signal_id=<correlation_id> (the linked signal is often a different type)
        example: 75b45fe1-ecc2-4629-946b-fd9058c3b2ca
        type: string
        x-nullable: true
      email:
        description: the email address of the account that sent the signal (the user's
          email, or the service account's contact email). Not included in public ISN
          searches
        example: sender@example.com
        type: string
      is_withdrawn:
        description: true if the signal has been withdrawn (withdrawn signals are
          only returned when include_withdrawn=true)
        example: false
        type: boolean
      isn_slug:
        description: the ISN the signal is in
        example: sample-isn
        type: string
      local_ref:
        description: the sender's reference for the signal - unique for the sending
          account, ISN and signal type
        example: item_id_#1
        type: string
      sem_ver:
        description: the version of the signal type
        example: 0.0.1
        type: string
      signal_created_at:
        description: when the signal was first received
        example: "2026-09-27T14:02:00.123456Z"
        type: string
      signal_id:
        description: the server generated ID of the signal. Use it as the correlation_id
          when submitting signals that link to this signal, and as the signal_id search
          filter
        example: 4cedf4fa-2a01-4cbf-8668-6b44f8ac6e19
        type: string
      signal_type_slug:
        description: the signal type (use signal_type_slug and sem_ver, not the search
          URL, to build the URLs of correlated signals - they are often a different
          type)
        example: sample-signal-type
        type: string
      signal_updated_at:
        description: 'when the signal last changed: a new version was received, or
          the signal was withdrawn (this is the cursor used when polling)'
        example: "2026-09-27T14:02:00.123456Z"
        type: string
      signal_version_id:
        description: the server generated ID of this version of the signal
        example: 835788bd-789d-4091-96e3-db0f51ccbabc
        type: string
      version_created_at:
        description: when this version was received
        example: "2026-09-27T14:02:00.123456Z"
        type: string
      version_number:
        description: the version number of this version (1 for the first version,
          incremented each time the signal is changed)
        example: 1
        type: integer
    type: object
  handlers.SearchSignalWithCorrelationsAndVersions:
    properties:
      account_id:
        description: the account that sent the signal
        example: a38c99ed-c75c-4a4a-a901-c9485cf93cf3
        type: string
      account_type:
        description: the type of account that sent the signal
        enum:
        - user
        - service_account
        example: service_account
        type: string
      content:
        description: 'the signal content: the json payload for json signals and events,
          or the document metadata (name, mime_type, size_bytes and sha256) for documents'
        type: object
      content_kind:
        description: 'how the content is sent and stored: json (the content is the
          signal), document (the content is the document metadata - the document is
          downloaded from the content endpoint) or event (the content is the event,
          including occurred_at)'
        enum:
        - json
        - document
        - event
        example: json
        type: string
      correlated_signals:
        description: |-
          the signals linked to this signal - those whose correlation_id is this signal's signal_id (include_correlated=true).
          Correlation is one level deep: the signals linked to these signals are not included
        items:
          $ref: '#/definitions/handlers.SearchSignal'
        type: array
      correlation_id:
        description: |-
          the signal_id of the signal this signal is linked to (the correlation_id it was submitted with). Null if the signal is not linked to another signal.
          To fetch the linked signal, use GET /api/signals/search?signal_id=<correlation_id> (the linked signal is often a different type)
        example: 75b45fe1-ecc2-4629-946b-fd9058c3b2ca
        type: string
        x-nullable: true
      email:
        description: the email address of the account that sent the signal (the user's
          email, or the service account's contact email). Not included in public ISN
          searches
        example: sender@example.com
        type: string
      is_withdrawn:
        description: true if the signal has been withdrawn (withdrawn signals are
          only returned when include_withdrawn=true)
        example: false
        type: boolean
      isn_slug:
        description: the ISN the signal is in
        example: sample-isn
        type: string
      local_ref:
        description: the sender's reference for the signal - unique for the sending
          account, ISN and signal type
        example: item_id_#1
        type: string
      previous_signal_versions:
        description: the earlier versions of this signal (include_previous_versions=true)
        items:
          $ref: '#/definitions/handlers.PreviousSignalVersion'
        type: array
      sem_ver:
        description: the version of the signal type
        example: 0.0.1
        type: string
      signal_created_at:
        description: when the signal was first received
        example: "2026-09-27T14:02:00.123456Z"
        type: string
      signal_id:
        description: the server generated ID of the signal. Use it as the correlation_id
          when submitting signals that link to this signal, and as the signal_id search
          filter
        example: 4cedf4fa-2a01-4cbf-8668-6b44f8ac6e19
        type: string
      signal_type_slug:
        description: the signal type (use signal_type_slug and sem_ver, not the search
          URL, to build the URLs of correlated signals - they are often a different
          type)
        example: sample-signal-type
        type: string
      signal_updated_at:
        description: 'when the signal last changed: a new version was received, or
          the signal was withdrawn (this is the cursor used when polling)'
        example: "2026-09-27T14:02:00.123456Z"
        type: string
      signal_version_id:
        description: the server generated ID of this version of the signal
        example: 835788bd-789d-4091-96e3-db0f51ccbabc
        type: string
      version_created_at:
        description: when this version was received
        example: "2026-09-27T14:02:00.123456Z"
        type: string
      version_number:
        description: the version number of this version (1 for the first version,
          incremented each time the signal is changed)
        example: 1
        type: integer
    type: object
  handlers.ServiceAccountRotateResponse:
    properties:
      client_id:
        example: sa_exampleorg_k7j2m9x1
        type: string
      client_secret:
        example: dGhpcyBpcyBhIHNlY3JldA
        type: string
      expires_at:
        example: "2025-07-05T10:30:00Z"
        type: string
      expires_in:
        description: seconds (1 year)
        example: 31536000
        type: integer
    type: object
  handlers.SignalSubmissionResponse:
    properties:
      account_id:
        description: AccountID is the account that sent the data
        example: a38c99ed-c75c-4a4a-a901-c9485cf93cf3
        type: string
      batch_ref:
        description: BatchRef is the client supplied batch identifier
        example: daily-sync-2026-04-02
        type: string
      results:
        description: Results contains per-ISN outcomes.  It will only contain one
          entry for standard signal submissions (the ISN from the URL)
        items:
          $ref: '#/definitions/handlers.IsnResult'
        type: array
      summary:
        allOf:
        - $ref: '#/definitions/handlers.CreateSignalsSummary'
        description: Summary contains the summary of counts
      unroutable_signals:
        description: UnroutableSignals is only included in Signal Router responses,
          and is omitted when there are no unroutable signals
        items:
          $ref: '#/definitions/handlers.FailedSignal'
        type: array
    type: object
  handlers.SignalType:
    properties:
      content_kind:
        enum:
        - json
        - document
        - event
        example: json
        type: string
      created_at:
        example: "2025-06-03T13:47:47.331787+01:00"
        type: string
      detail:
        example: Sample signal type description
        type: string
      id:
        example: 67890684-3b14-42cf-b785-df28ce570400
        type: string
      is_in_use:
        description: IsInUse shows whether the signal type is enabled on this ISN
        example: true
        type: boolean
      readme_url:
        description: ReadmeURL is empty if no readme was supplied
        example: https://example.com/readme.md
        type: string
      schema_url:
        description: SchemaURL is empty if signals are not validated against a schema
        example: https://example.com/schema.json
        type: string
      sem_ver:
        example: 1.0.0
        type: string
      slug:
        example: sample-signal-type
        type: string
      title:
        example: Sample Signal Type
        type: string
      updated_at:
        example: "2025-06-03T13:47:47.331787+01:00"
        type: string
    type: object
  handlers.StoredSignal:
    properties:
      local_ref:
        description: LocalRef is the sender-supplied identifier for the signal
        example: item_id_#1
        type: string
      signal_id:
        description: SignalID is the server generated ID for this signal
        example: b8ded113-ac0e-4a2c-a89f-0876fe97b440
        type: string
      signal_version_id:
        description: SignalVersionID is the server generated version ID for the version
          of this signal created by the handler
        example: 835788bd-789d-4091-96e3-db0f51ccbabc
        type: string
      unchanged:
        description: |-
          Unchanged is true if the signal was resubmitted with the same content and correlation_id (or no correlation_id) -
          the existing version is returned and no new version is created
        example: false
        type: boolean
      version_number:
        description: |-
          VersionNumber is the version created by the server
          (where the same localRef is received in subsequent loads the versionNumber is incremented)
        example: 1
        type: integer
    type: object
  handlers.SubmittedSignal:
    properties:
      content:
        description: Content is the json payload that is validated against the stored
          signal type schema
        type: object
      correlation_id:
        description: CorrelationID is an optional ID for another signal in the same
          ISN - the submitted signal is linked to the correlated signal
        example: 75b45fe1-ecc2-4629-946b-fd9058c3b2ca
        type: string
      local_ref:
        description: |-
          LocalRef is the sender's ID for the signal (usually its ID in the sender's own system).
          Sending the same LocalRef to the same ISN again stores a new version of the signal (the same LocalRef sent to another ISN is a separate signal)
        example: item_id_#1
        type: string
    type: object
  handlers.UpdatePasswordRequest:
    properties:
      current_password:
        example: lkIB53@6O^Y
        type: string
      new_password:
        example: ue6U>&X3j570
        type: string
    type: object
  handlers.WithdrawSignalRequest:
    properties:
      local_ref:
        example: item_id_#1
        type: string
    type: object
  responses.ErrorResponse:
    properties:
      error_code:
        allOf:
        - $ref: '#/definitions/apperrors.ErrorCode'
        description: Standard app error code
        example: error_code
      message:
        description: Client message
        example: client message
        type: string
      request_id:
        description: request tracking id
        example: a1b2c3d4
        type: string
    type: object
  responses.OAuthErrorResponse:
    properties:
      error:
        description: Error is the RFC 6749 §5.2 token endpoint error code
        example: invalid_grant
        type: string
      error_code:
        allOf:
        - $ref: '#/definitions/apperrors.ErrorCode'
        description: ErrorCode contains the internal app error code
        example: refresh_token_invalid
      error_description:
        description: ErrorDescripton contains the detailed description
        example: session expired, please log in again
        type: string
    type: object
info:
  contact: {}
  description: |-
    Signals ISN service API for managing Information Sharing Networks

    ## API documentation
    - [/docs](/docs): using the API - authentication, finding ISNs, and submitting and searching signals
    - [/admin-docs](/admin-docs): administering the service - ISNs and their permissions, signal types, routing, and accounts
    - [/ui-docs](/ui-docs): the browser-based management interface

    ## Common Error Responses
    All endpoints may return:
    - `400` Malformed request (invalid json, missing required fields, etc.)
    - `401` Unauthorized (invalid credentials)
    - `403` Forbidden (insufficient permissions)
    - `404` Resource not found (e.g. an ISN or signal type that doesn't exist or is not in use)
    - `413` Request body exceeds size limit
    - `429` Rate limit exceeded
    - `500` Internal server error
    - `504` Request timed out (`timeout`)

    Individual endpoints document their specific business logic errors.

    Standard error responses include a JSON response body containing `error_code`, `message` and `request_id` fields.

    The /oauth endpoints return `error` (the RFC6749 standard error code), `error_code` and `error_description` fields instead.

    ## Request Limits
    The endpoints are protected by:
    - **Rate limiting**: Configurable requests per second (all endpoints)
    - **Request size limits** (configurable - these are the defaults): 64KB for admin/auth endpoints, 5MB for json and event signal submissions, 20MB for document uploads

    Check the `Signalsd-Max-Request-Size` response header for the configured size limit of the endpoint called.

    The rate limit is set globally and prevents abuse of the service.
    In production there will be additional protections in place such as per-IP rate limiting provided by the load balancer/reverse proxy.

    ## Authentication & Authorization

    ### OAuth
    The signalsd backend service acts as an OAuth 2.0 Authorization Server and supports web users and service accounts.

    ### Authentication Flows
    - **Web users**: (Refresh Token Grant Type) Authentication via /api/auth/login -> receive JWT access token + HTTP-only refresh cookie -> use bearer tokens for API calls
    - **Service accounts**: Clients implement OAuth Client Credentials flow -> receive JWT access token -> use bearer tokens for API calls

    ### Token Usage
    All protected API endpoints require a valid JWT access token in the Authorization header:
    ```
    Authorization: Bearer <jwt-access-token>
    ```

    **Token Refresh (Service Accounts):**
    - Client calls `POST /oauth/token` with `grant_type=client_credentials` in the form body, and the client ID/secret as form fields or HTTP Basic auth
    - API validates credentials and issues new access token
    - Client receives new bearer token for subsequent API calls

    **Login (Web Users):**
    - Client calls `/api/auth/login` with email and password and receives an access token in the response body. The refresh token is set as an HTTP-only cookie.

    **Token Refresh (Web Users):**
    - Client calls `POST /oauth/token` with `grant_type=refresh_token` in the form body (the HTTP-only refresh token cookie is sent automatically)
    - API validates refresh token and issues new access token + rotated refresh cookie
    - Client receives new bearer token for subsequent API calls

    **Token Lifetimes:**
    - Access tokens: 30 minutes
    - Refresh tokens: 30 days (web users only). Each refresh issues a new refresh token valid for another 30 days, so users only need to log in again if they don't use the service for 30 days.

    Each login or refresh revokes the user's other refresh tokens, so a user has one active session at a time.

    The account's role and ISN permissions are included in the access token when it is issued. Changes to ISN permissions (and disabling an account) take effect when the account next gets an access token - up to 30 minutes later.
    The exception is the admin endpoints, which check the account's current role and status on every request, so role changes and disabled accounts take effect on them straight away.

    Changing or resetting a password ends all the user's sessions (their refresh tokens are revoked), so they will need to log in again.

    ### CSRF Protection
    The refresh token used by the /oauth API endpoints is stored in an HttpOnly cookie (to prevent access by JavaScript)
    and marked with SameSite=Strict (to prevent it from being sent in cross-site requests, mitigating CSRF).
    The server also rejects POST, PUT and DELETE requests that the browser reports as coming from another origin, since SameSite treats sibling subdomains as the same site.

    The other API endpoints are authenticated with bearer tokens, which browsers do not send automatically, so they are not open to CSRF.

    ## Browser Integrations
    Browser-based apps on other sites can only call the public endpoints directly.

    The other endpoints have no CORS policy, so web pages on other origins can't use them: the browser won't send an access token to them or let the page read the response.
    Instead, call the API from your app's backend (or a small proxy) and pass the results to the browser. This is the "backend for frontend" pattern used by the signalsd UI.

    Server-side clients (scripts, services etc) are not affected by CORS and can call any endpoint they have access to.

    ## Date/Time Handling

    **URL Parameters**: The following ISO 8601 formats are accepted in URL query parameters:
    - 2006-01-02T15:04:05Z (UTC)
    - 2006-01-02T15:04:05+07:00 (with offset)
    - 2006-01-02T15:04:05.999999999Z (nano precision)
    - 2006-01-02 (date only, treated as start of day UTC: 2006-01-02T00:00:00Z)

    Note: When including a timestamp with a timezone offset in a query parameter, encode the + sign as %2B (e.g. 2025-08-31T12:00:00%2B07:00). Otherwise, + may be interpreted as a space.

    **Response Bodies**: All date/time fields in JSON responses use RFC3339 format (ISO 8601):
    - Example: "2025-06-03T13:47:47.331787+01:00"

    # Signals

    ## Content kinds
    Each signal type has a `content_kind`, which determines how its signals are sent:
    - **json**: JSON content, validated against the signal type's schema. Sent with *Submit Signals* (or *Submit Signals via Router*).
    - **document**: a file (PDF, JPEG, PNG or XML). Sent with *Upload a Document* and retrieved with *Download a Document*. Search results contain the document's metadata, not the file.
    - **event**: an immutable JSON record that a process waypoint has been reached for another signal (e.g. an export health certificate was approved for a consignment). Sent with *Submit Signals* (see Events below).

    Search, withdrawal and batches work the same way for every kind, and search results include each signal's `content_kind`.

    ## Versions and resubmissions
    A signal describes one thing, such as a consignment or a certificate. As more data emerges or corrections are made, you send the signal again and the service stores it as a new version of the same signal, so recipients see the latest version and can see its history.

    You give each signal a `local_ref`, usually its ID in your own system, and send the same `local_ref` every time you send that signal. A `local_ref` is unique for your account, the ISN and the signal type version (sending the same `local_ref` to two ISNs or to two different signal types, creates two independent signals).

    The service gives each signal a `signal_id` when it is first stored. Other participants use it to refer to your signal (e.g. when they want to link to it - see Correlation below).

    When a `local_ref` is sent to the same ISN again:
    - **If something changed**, a new version of the signal is stored (json and document signals).
    - **If nothing changed** (the same content, and the same or no `correlation_id`), nothing is stored. The response contains the `signal_id`, `signal_version_id` and `version_number` of the existing latest version, with `unchanged: true`, so requests can be safely retried. JSON content is compared as JSON (key order and whitespace are ignored). Documents compare the file and its filename.
    - **If the signal was withdrawn**, it is reactivated with a new version (json and document signals).
    - **Events are never changed**: resubmitting an event with different content or a different `correlation_id`, or after it was withdrawn, fails with `resource_already_exists`. To correct an event, withdraw it and send a new event with a new `local_ref`.

    ## Batches
    Each request also has a `batch_ref`: a label you choose to track your requests, e.g. one per scheduled run. Requests sent with the same `batch_ref` are added to the same batch, and *Get Batch Status* reports what was stored and what failed in it. The `batch_ref` doesn't affect how signals are stored.

    ## Correlation
    A signal can be linked to another signal in the same ISN by setting its `correlation_id` to the other signal's `signal_id`.

    Search results include each signal's `correlation_id` (null if the signal is not linked to another signal).

    Search with `include_correlated=true` returns the signals linked to each result, whatever their type, and the `correlation_id` search filter returns the signals linked to one signal. To fetch the signal a result is linked to, search with `signal_id={correlation_id}` (see *Following signals* below).

    **Correlate to the entity directly.** For example, correlate a consignment's documents and events to the consignment itself, not to each other. Correlation is one level deep: `include_correlated` only returns signals that are correlated directly to the returned signal.

    **Correlating is sharing.** Correlating your signal to a signal created by another account is like emailing that account a copy, but with the extra controls that you can withdraw it or send new versions, and they see those changes. Unlike email:
    - withdrawing a signal stops further access through the service
    - if a new version changes the correlation_id, access moves with it: the owner of the newly correlated signal can see every version, and the previous owner can no longer access it through the service

    ## Partial success and resending
    Signals in a request are validated and stored one at a time: the valid signals are stored and the ones that fail (e.g. content that doesn't match the schema, or an unknown `correlation_id`) are listed in the response with an error code. The response status tells you whether all, some or none of the signals were stored (see each endpoint for the details).

    This is common when testing a new signal type, where some records in a large payload match the schema and others don't. Fix the failed signals and resend them. Signals that are resent unchanged are not stored again, so you can do this in either of these ways:
    - **Resend the whole request.** Signals that were already stored are returned with `unchanged: true`, and only the fixed signals are stored. Note that any json signal in the request that has been withdrawn since it was sent is reactivated (withdrawn events are not reactivated - they fail with `resource_already_exists`).
    - **Resend only the failures.** *Get Batch Status* lists the batch's unresolved failures.

    When a whole *Submit Signals* request fails (an error response such as 400, 401, 403, 404, 413 or 500), or you get no response, nothing is recorded in the batch, so resend the whole request once the problem is fixed.

    **Timeouts.** If the server's request timeout is reached partway through a request, the signals already processed stay stored and the rest are returned as `database_error` failures (which may not be recorded in the batch), so resend the whole request.

    ## Who can see signals
    - Accounts with **read** access to an ISN can see every signal in it.
    - Accounts with **write-only** access can see the signals they created, and the signals other accounts have correlated to their signals (one level deep).
    - Signals in a **public** ISN can be searched by anyone, using *Signal Search (public ISNs)* (`/api/public/isn/...`). Downloading a document still needs an access token and access to the ISN.

    An account can have different access in each ISN. Searches across several ISNs apply each ISN's rule to the signals in it.

    Privacy between participants is set by the ISN's permissions. For example, in a network where all participants share their data with a government agency but not with each other, the participants are given write-only access and the agency is given read access.

    ## Events
    Event signals record that a process waypoint has been reached - e.g. `ehc-approved` (an export health certificate was approved) or `departed-origin` - for the signal they are correlated to. Each waypoint is its own event signal type, so recipients choose which events they receive by choosing which event types to search or poll.
    - **`correlation_id` is required**: correlate the event to the signal it is about (e.g. the consignment). Requests containing events without one are rejected.
    - **`content` must include `occurred_at`**: the time the waypoint was reached, as an RFC 3339 timestamp with a time zone offset (e.g. `2026-09-27T14:02:00Z`).
    - **`subject`**: if the event is about a specific version of a signal (e.g. version 3 of a document), name it in a `subject` field in `content`: `{"signal_id": "...", "version": 3}`. Always include the version - later versions of the document may be different.
    - **Events are immutable** (see Versions and resubmissions).
    - The service doesn't enforce an order: events are accepted in any order and can repeat (e.g. several inspections). To build a timeline, order a signal's correlated events by `occurred_at`.

    Example: `{"local_ref": "ehc-approved-001", "correlation_id": "<consignment signal_id>", "content": {"occurred_at": "2026-09-27T14:02:00Z", "subject": {"signal_id": "<document signal_id>", "version": 3}, "certificate_no": "EHC-001"}}`

    **Schemas for event types.** An event type's schema validates the event's `content`, as for json signal types, but:
    - the service checks `occurred_at` whatever the schema says. The schema must still allow it: declare `occurred_at` (and `subject`, if the type has one) and list it as required, especially if the schema uses `"additionalProperties": false`
    - `occurred_at` and `subject` are reserved - don't use them for anything else
    - the service doesn't check `subject` yet, so a type whose events have a subject should require it in its schema, as `{"signal_id": <uuid>, "version": <integer>}`

    ## Searching without naming the ISN
    When receiving a signal_id without details of the ISN it is in you can use the following endpoints:
    ```
    GET /api/signal-types/{signal_type_slug}/v{sem_ver}/signals/search
    GET /api/signals/search
    ```
    These searches cover every ISN your account is a member of. Each result includes its `isn_slug`, `signal_type_slug` and `sem_ver`, so you can build further URLs (e.g. *Download a Document*) from it.

    ## Polling for changes
    To find out about new and changed signals, poll the signal types you are interested in, or every signal type:
    ```
    GET /api/signal-types/{signal_type_slug}/v{sem_ver}/signals/search?updated_since={cursor}&include_withdrawn=true
    GET /api/signals/search?updated_since={cursor}&include_withdrawn=true
    ```
    - `updated_since` returns the signals that changed (a new version was received, or the signal was withdrawn) since that time. Results are ordered by `signal_updated_at` across all your ISNs, so the last result's `signal_updated_at` is your cursor.
    - Use `include_withdrawn=true`, so withdrawn signals are returned with `is_withdrawn: true` (otherwise they silently drop out of the results).
    - **Polling is at-least-once, so overlap your polls**: set `updated_since` to 1 minute before your cursor, and skip the results you have already seen (the same `signal_id` and `signal_updated_at`). This is necessary because `signal_updated_at` is set when the service starts storing a signal, not when it finishes, so a signal that was still being stored when you last polled can appear with a `signal_updated_at` a little before your cursor. The 1 minute overlap makes sure your next poll picks it up.
    - Search results are not paginated, so poll often enough to keep each result set small.

    To poll a single ISN, use *Signal Search (private ISNs)* in the same way. The same rules apply, with results ordered by `signal_updated_at` within that ISN:
    ```
    GET /api/isn/{isn_slug}/signal-types/{signal_type_slug}/v{sem_ver}/signals/search?updated_since={cursor}&include_withdrawn=true
    ```

    ## Following signals
    **You received an event and need the signal it is about.** For example, an `ehc-approved` event is about a consignment, and you want the consignment with its documents and other events. The event's `correlation_id` is the consignment's `signal_id`:
    ```
    GET /api/signals/search?signal_id={correlation_id}&include_correlated=true&include_withdrawn=true
    ```
    The result is the consignment, with everything linked to it in. If the consignment was withdrawn, it is returned with `is_withdrawn: true`. Write-only accounts get an empty result if the consignment belongs to another account (see Who can see signals). The same search tells you what any `signal_id` is.

    **You sent signals through the router and want the responses.** For example, you send consignments through the router, and the ports send back advice events linked to them. Poll the advice event type: the events from every port are returned, and each event's `correlation_id` is the `signal_id` the router returned for your consignment.
    ```
    GET /api/signal-types/{advice_type}/v{sem_ver}/signals/search?updated_since={cursor}&include_withdrawn=true
    ```

    **You keep a copy of the data.** For example, you store every consignment, and the documents and events linked to them. Poll every signal type, so you need one cursor rather than one for each signal type:
    ```
    GET /api/signals/search?updated_since={cursor}&include_withdrawn=true
    ```
    - store each result by `signal_id`, and use its `correlation_id` to attach it to the signal it is linked to
    - if a new version links a signal to a different signal, it is returned with the new `correlation_id`
    - a linked signal can arrive before the signal it is linked to, so keep it until that signal arrives
    - signals of new signal types are returned too: skip the types you don't need

    **You want to know when anything about one signal changes.** For example, you want an alert when a consignment gets a new version, or when a document or event is linked to it. Linking a signal to a consignment changes the linked signal, not the consignment, so polling the consignment type with `updated_since` doesn't show new documents or events. Instead, poll the consignment with everything linked to it, and compare the result with the previous poll:
    ```
    GET /api/signals/search?signal_id={signal_id}&include_correlated=true&include_withdrawn=true
    ```
    - a `signal_id` that wasn't there before: a signal was linked to the consignment
    - a different `signal_updated_at`: a new version, or a withdrawal (`is_withdrawn: true`)
    - a `signal_id` that is no longer there: the signal was linked to a different signal (or can no longer be seen)

    Each poll returns the whole set, so there is no cursor to keep.
