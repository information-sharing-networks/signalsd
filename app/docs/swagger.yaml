  /oauth/revoke:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: |
        Revokes credentials to prevent them being used to obtain new access tokens.
        The request body must be `application/x-www-form-urlencoded` (RFC 6749).
        Any access tokens already issued remain valid until they expire (30 minutes).

        ---

        **Service Accounts — `client_credentials` grant (logout / credential rotation)**

        Include in the request body:
        - `grant_type=client_credentials`
        - `client_id=<your_client_id>`
        - `client_secret=<your_client_secret>`

        Alternatively, credentials may be supplied via HTTP Basic Auth (`Authorization: Basic base64(client_id:client_secret)`).

        Revokes **all** client secrets for the service account, which prevents any further token requests
        until an admin reissues credentials via `POST /api/auth/service-accounts/reissue-credentials`.
        This does not permanently disable the account — use `POST /api/admin/accounts/{account_id}/disable` for that.

        ---

        **Web Users — `refresh_token` grant (logout)**

        Include in the request body:
        - `grant_type=refresh_token`

        The refresh token is read automatically from the `refresh_token` HTTP-only cookie.
        No additional form fields are required.

        Revokes the current refresh token. The user must log in again to obtain a new one.
      parameters:
      - description: Grant type
        enum:
        - client_credentials
        - refresh_token
        in: formData
        name: grant_type
        required: true
        type: string
      - description: Client ID (client_credentials grant only)
        in: formData
        name: client_id
        type: string
      - description: Client secret (client_credentials grant only)
        in: formData
        name: client_secret
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: unsupported_grant_type · invalid_request · invalid_grant (refresh
            token missing, expired or revoked - error_code refresh_token_invalid)
          schema:
            $ref: '#/definitions/responses.OAuthErrorResponse'
        "401":
          description: invalid_client
          schema:
            $ref: '#/definitions/responses.OAuthErrorResponse'
        "500":
          description: server_error
          schema:
            $ref: '#/definitions/responses.OAuthErrorResponse'
      summary: Revoke Credentials (OAuth 2.0 revocation endpoint)
      tags:
      - OAuth 2.0
  /oauth/token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: |
        Issues a new access token. The request body must be `application/x-www-form-urlencoded` (RFC 6749).

        Service accounts use the `client_credentials` grant, web users use the `refresh_token` grant - see below.

        ---

        **Service Accounts — `client_credentials` grant**

        Include in the request body:
        - `grant_type=client_credentials`
        - `client_id=<your_client_id>`
        - `client_secret=<your_client_secret>`

        Alternatively, credentials may be supplied via HTTP Basic Auth (`Authorization: Basic base64(client_id:client_secret)`).

        Returns a new access token in the response body. Access tokens expire after 30 minutes.

        ---

        **Web Users — `refresh_token` grant**

        Include in the request body:
        - `grant_type=refresh_token`

        The refresh token is read automatically from the `refresh_token` HTTP-only cookie set during login.
        No additional form fields are required.

        Returns a new access token in the response body. The rotated refresh token is set as a new HTTP-only cookie
        (the cookie's path is `/oauth`, so browsers only send it to the /oauth endpoints).
        Access tokens expire after 30 minutes. Each refresh issues a new refresh token that expires 30 days later,
        so the user only has to log in again if they don't refresh for 30 days. Refreshing revokes the user's other refresh tokens (one session per user).
      parameters:
      - description: Grant type
        enum:
        - client_credentials
        - refresh_token
        in: formData
        name: grant_type
        required: true
        type: string
      - description: Client ID (client_credentials grant only)
        in: formData
        name: client_id
        type: string
      - description: Client secret (client_credentials grant only)
        in: formData
        name: client_secret
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AccessTokenResponse'
        "400":
          description: unsupported_grant_type · invalid_request · invalid_grant
          schema:
            $ref: '#/definitions/responses.OAuthErrorResponse'
        "401":
          description: invalid_client — wrong, expired, or revoked client secret.
            If your secret has expired, use POST /api/auth/service-accounts/rotate-secret
            to self-serve a new secret.
          schema:
            $ref: '#/definitions/responses.OAuthErrorResponse'
        "500":
          description: server_error
          schema:
            $ref: '#/definitions/responses.OAuthErrorResponse'
      summary: Get Access Token (OAuth 2.0 token endpoint)
      tags:
      - OAuth 2.0
produces:
- application/json
securityDefinitions:
  BearerAccessToken:
    description: Bearer {JWT access token}
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: 'Access token issuance and revocation. The signalsd backend acts as
    an OAuth 2.0 Authorization Server: service accounts use the client_credentials
    grant, web users use the refresh_token grant. Start here if you are connecting
    a system to the API.'
  name: OAuth 2.0
- description: Registration, login and password management for web users. A signed-in
    user can change their own password here; users who have forgotten their password
    are sent a one-time link by an admin instead (see *Generate Password Reset Link*
    in the admin API docs). Use the OAuth 2.0 endpoints to obtain access tokens.
  name: User Authentication
- description: Manage a service account's own credentials (used for system-to-system
    access). Service accounts are registered by an admin (see the admin API docs).
    Use the OAuth 2.0 endpoints to exchange service account credentials for an access
    token.
  name: Service Accounts
- description: Find the Information Sharing Networks (ISNs) and the signal types available
    in them. Any authenticated account can use these endpoints.
  name: ISN Discovery
- description: Submit json and event signals, upload documents, and withdraw signals
  name: Submit Signals
- description: Search for signals and download documents
  name: Search Signals
- description: Track the status of submitted batches
  name: Batches
