        It takes the same search parameters as *Signal Search (private ISNs)*.
        Each result includes its `isn_slug`, `signal_type_slug` and `sem_ver`. Results are ordered by `signal_updated_at` (oldest first) across all the ISNs, so polling works as for a single ISN.

        The visibility rules are the same as for a single ISN, and are applied separately in each ISN: if you have read access to one ISN and write-only access to another, you see every signal in the first, and only your own signals and the signals correlated to them in the second.

        A `signal_id` in an ISN you are not a member of returns no results, the same as a `signal_id` that doesn't exist.
        A signal type that isn't used in any of your ISNs also returns no results.

        The ISNs searched are the ones in your access token, so an ISN you have just been added to is searched once you next get an access token.

