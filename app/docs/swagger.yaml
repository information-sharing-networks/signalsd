  /api/public/isn/{isn_slug}/signal-types/{signal_type_slug}/v{sem_ver}/signals/search:
    get:
      description: |-
        Search for signals in public ISNs (no authentication required).

        The endpoint returns the latest version of each signal (use `include_previous_versions=true` to see earlier versions).
        Results are ordered by `signal_updated_at` (oldest first).

        **Search parameters**

        At least one of these is required: `start_date` and `end_date`, `updated_since`, `account_id`, `signal_id`, `local_ref` or `correlation_id`.
        `start_date` and `end_date` must be used together. They filter on when the signal's latest version was received (`version_created_at`).

        `updated_since` filters on when the signal last changed (`signal_updated_at`): a new version was received, or the signal was withdrawn.

        **Polling for changes**

        Polling is at-least-once: use `updated_since` as a cursor, start each poll 1 minute before the last `signal_updated_at` you received, and skip the results you have already seen (the same `signal_id` and `signal_updated_at`).
        Use `include_withdrawn=true`, so signals withdrawn since your last poll are returned with `is_withdrawn: true` rather than left out of the results.
        See *Polling for changes* in the API overview for more details.

        **Documents**

        For json signals and events, the signal is returned in the `content` field.
        Documents are files, so they are not included in the search results: the `content` field holds the document's metadata (`name`, `mime_type`, `size_bytes` and `sha256`).
        Downloading the file requires an account on the ISN and an access token (see *Download a Document*).
      parameters:
      - description: ISN slug
        example: sample-isn
        in: path
        name: isn_slug
        required: true
        type: string
      - description: Signal type slug
        example: signal-type-1
        in: path
        name: signal_type_slug
        required: true
        type: string
      - description: Signal type version
        example: 1.0.0
        in: path
        name: sem_ver
        required: true
        type: string
      - description: Signals whose latest version was created at or after this time
          (use with end_date)
        example: "2006-01-02T15:05:00Z"
        in: query
        name: start_date
        type: string
      - description: Signals whose latest version was created at or before this time
          (use with start_date)
        example: "2006-01-02T15:15:00Z"
        in: query
        name: end_date
        type: string
      - description: Signals that changed (a new version was received, or the signal
          was withdrawn) since this time (to poll for changes, use with include_withdrawn=true
          and set it 1 minute before the last signal_updated_at you received)
        example: "2006-01-02T15:05:00Z"
        in: query
        name: updated_since
        type: string
      - description: Account ID
        example: def87f89-dab6-4607-95f7-593d61cb5742
        in: query
        name: account_id
        type: string
      - description: Return the signal with this signal_id (e.g. the correlation_id
          of a signal of another type)
        example: 4cedf4fa-2a01-4cbf-8668-6b44f8ac6e19
        in: query
        name: signal_id
        type: string
      - description: Local reference
        example: item_id_#1
        in: query
        name: local_ref
        type: string
      - description: Return the signals of this type that are linked to the signal
          with this signal_id (those whose correlation_id is this value)
        example: 4cedf4fa-2a01-4cbf-8668-6b44f8ac6e19
        in: query
        name: correlation_id
        type: string
      - description: 'Include withdrawn signals (default: false)'
        example: "true"
        in: query
        name: include_withdrawn
        type: string
      - description: 'Include signals that link to each returned signal (default:
          false)'
        example: "true"
        in: query
        name: include_correlated
        type: string
      - description: 'Include previous versions of each returned signal (default:
          false)'
        example: "true"
        in: query
        name: include_previous_versions
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.SearchSignalWithCorrelationsAndVersions'
            type: array
        "400":
          description: invalid_url_param
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: resource_not_found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: database_error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Signal Search (public ISNs)
      tags:
      - Search Signals
  /api/router/signal-types/{signal_type_slug}/v{sem_ver}/signals:
    post:
      description: |-
        Submit JSON or event signals without specifying a target ISN - the router resolves the ISN for each signal
        (use _Upload a Document via Router_ to route documents).

        **ISN resolution by correlation ID**

        Where a _correlation ID_ is supplied, the routing rules do not apply and the signal
        is routed to the ISN that received the correlated signal.

        Events always have a correlation ID, so they are always routed to the ISN of the correlated signal.

        **ISN resolution by pattern match**

        If no correlation ID is supplied, the ISN is resolved using the routing rules defined for the _Signal Type_.
        The rules are applied in the order defined in the _Routing Rules Config_ (first match is accepted).

        **Resubmissions**

        local_ref is unique per account/ISN, so a resubmitted signal only updates the original if it resolves to the same ISN.
        If it resolves to a different ISN (e.g. because the routing field changed) it is stored as a new signal on that ISN, and the original signal is not changed - withdraw it if it is no longer needed.

        **Resolution failures**

        Each signal is validated against the signal type's schema before it is routed.

        Signals that can't be routed are listed in `unroutable_signals` (and counted in `unroutable_count`):
        - signals that fail schema validation (`malformed_body`, with the validation errors)
        - signals that do not contain the routing field defined in the _Routing Rules Config_, or do not satisfy any of the routing rules (`invalid_request`)
        - signals whose correlation_id is not found, or whose ISN is not in use (`invalid_correlation_id`)

        Signals that resolve to an ISN where the account lacks access or write permission (`forbidden`), or where the ISN or signal type is not in use (`resource_not_found`),
        are rejected and listed in the `failed_signals` of that ISN's result.

        Unroutable and rejected signals don't stop the other signals in the request from being stored.
        The response is 200 if every signal was stored, 207 if some were, and 422 if none were. See "Partial success and resending" in the introduction for how to resend the failures.

        **Usage**

        Other than the ISN resolution, this endpoint behaves the same way as the standard _Submit Signals_ endpoint
        (request format, batches, error handling, schema validation, versions and correlation).
        The response contains a result for each ISN the signals were routed to.
      parameters:
      - description: signal type slug
        example: sample-signal-type
        in: path
        name: signal_type_slug
        required: true
        type: string
      - description: version
        example: 1.0.0
        in: path
        name: sem_ver
        required: true
        type: string
      - description: signals to submit
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateSignalsRequest'
      responses:
        "200":
          description: All signals processed successfully
          schema:
            $ref: '#/definitions/handlers.SignalSubmissionResponse'
        "207":
          description: Partial success - some signals succeeded, some failed
          schema:
            $ref: '#/definitions/handlers.SignalSubmissionResponse'
        "400":
          description: malformed_body | invalid_url_param
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: authorization_error | access_token_expired
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "413":
          description: request_too_large
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "422":
          description: Valid request format but all signals failed processing - returns
            detailed error information
          schema:
            $ref: '#/definitions/handlers.SignalSubmissionResponse'
        "500":
          description: database_error | internal_error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAccessToken: []
      summary: Submit Signals via Router
      tags:
      - Submit Signals
  /api/router/signal-types/{signal_type_slug}/v{sem_ver}/signals/upload:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Upload a document without specifying the target ISN: the document is sent to the ISN of the signal it is correlated with
        (e.g. a bill of lading is sent to the ISN that received its consignment).

        correlation_id is required - routing rules are not used for documents (they match on fields in JSON signals).
        The upload is rejected with 422 invalid_correlation_id if the correlated signal is not found or its ISN is not in use,
        and with 403 forbidden if the account does not have write permission on the correlated signal's ISN.

        Other than the ISN resolution, this endpoint behaves the same way as the standard _Upload a Document_ endpoint
        (request format, supported formats, versions and the optional sha256 field).

        The response includes the isn_slug of the ISN the document was sent to.
      parameters:
      - description: signal type slug
        example: bill-of-lading
        in: path
        name: signal_type_slug
        required: true
        type: string
      - description: version
        example: 1.0.0
        in: path
        name: sem_ver
        required: true
        type: string
      - description: label used to track uploads with Get Batch Status (up to 128
          alphanumeric characters, hyphens and underscores)
        in: formData
        name: batch_ref
        required: true
        type: string
      - description: your ID for the document - upload with the same local_ref to
          store a new version
        in: formData
        name: local_ref
        required: true
        type: string
      - description: the ID of the signal this document relates to - the document
          is sent to the same ISN
        in: formData
        name: correlation_id
        required: true
        type: string
      - description: the sha256 of the document (lowercase hex) - the upload is rejected
          if it does not match
        in: formData
        name: sha256
        type: string
      - description: the document (must be the last part of the request)
        in: formData
        name: file
        required: true
        type: file
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DocumentUploadResponse'
        "400":
          description: malformed_body | invalid_url_param
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: authorization_error | access_token_expired
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: resource_not_found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "413":
          description: request_too_large
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "415":
          description: unsupported_media_type
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "422":
          description: invalid_correlation_id
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: database_error | internal_error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "504":
          description: timeout
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAccessToken: []
      summary: Upload a Document via Router
      tags:
      - Submit Signals
  /api/signal-types/{signal_type_slug}/v{sem_ver}/signals/search:
    get:
      description: |-
        Search for signals of one signal type in every ISN your account is a member of, without naming the ISN (authentication required).
