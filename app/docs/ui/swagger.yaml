paths:
  /admin:
    get:
      description: Admin landing page. Requires isnadmin or siteadmin role. The site
        admin only features are not shown to ISN admins.
      responses:
        "200":
          description: HTML page
      summary: Admin dashboard
      tags:
      - UI Pages
  /admin/accounts/isn-admins/manage:
    get:
      description: Renders the ISN admin role management form. Requires siteadmin
        role.
      responses:
        "200":
          description: HTML page
      summary: Manage ISN admin roles page
      tags:
      - UI Pages
  /admin/accounts/manage:
    get:
      description: Renders the account enable/disable form for users and service accounts.
        Requires siteadmin role.
      responses:
        "200":
          description: HTML page
      summary: Manage account status page
      tags:
      - UI Pages
  /admin/accounts/site-admins/manage:
    get:
      description: Renders the site admin role management form. Requires siteadmin
        role.
      responses:
        "200":
          description: HTML page
      summary: Manage site admin roles page
      tags:
      - UI Pages
  /admin/isn/accounts/manage:
    get:
      description: Renders the ISN accounts management page. Requires admin rights
        for at least one ISN (the ISN owner, or a site admin).
      responses:
        "200":
          description: HTML page
      summary: Manage ISN accounts page
      tags:
      - UI Pages
  /admin/isn/create:
    get:
      description: Renders the create ISN form. Requires isnadmin or siteadmin role.
      responses:
        "200":
          description: HTML page
      summary: Create ISN page
      tags:
      - UI Pages
  /admin/isn/manage:
    get:
      description: Renders the ISN enable/disable page. Only shows ISNs the user administers.
        Requires isnadmin or siteadmin role.
      responses:
        "200":
          description: HTML page
      summary: Manage ISN status page
      tags:
      - UI Pages
  /admin/isn/signal-types/add:
    get:
      description: Renders the form to associate a signal type version with an ISN.
        Requires admin rights for at least one ISN (the ISN owner, or a site admin).
      responses:
        "200":
          description: HTML page
      summary: Add signal type to ISN page
      tags:
      - UI Pages
  /admin/isn/signal-types/manage:
    get:
      description: Renders the form to enable or disable signal types within an ISN.
        Requires admin rights for at least one ISN (the ISN owner, or a site admin).
      responses:
        "200":
          description: HTML page
      summary: Manage ISN signal type status page
      tags:
      - UI Pages
  /admin/isn/transfer-ownership:
    get:
      description: Renders the ISN ownership transfer page. Requires siteadmin role.
      responses:
        "200":
          description: HTML page
      summary: Transfer ISN ownership page
      tags:
      - UI Pages
  /admin/service-accounts/create:
    get:
      description: Renders the create service account form. Requires isnadmin or siteadmin
        role.
      responses:
        "200":
          description: HTML page
      summary: Create service account page
      tags:
      - UI Pages
  /admin/service-accounts/reissue-credentials:
    get:
      description: Renders the reissue credentials form. Requires siteadmin role.
      responses:
        "200":
          description: HTML page
      summary: Reissue service account credentials page
      tags:
      - UI Pages
  /admin/signal-types/create:
    get:
      description: Renders the create signal type form. Requires siteadmin role.
      responses:
        "200":
          description: HTML page
      summary: Create signal type page
      tags:
      - UI Pages
  /admin/signal-types/list:
    get:
      description: Renders a read-only report of all registered signal types. Requires
        admin rights for at least one ISN (the ISN owner, or a site admin).
      responses:
        "200":
          description: HTML page
      summary: List signal types page
      tags:
      - UI Pages
  /admin/signal-types/refresh-schema:
    get:
      description: Renders the form to fetch the schema of a signal type version again
        from GitHub, updating it in place. Requires siteadmin role.
      responses:
        "200":
          description: HTML page
      summary: Refresh signal type schema page
      tags:
      - UI Pages
  /admin/signal-types/register-new-schema:
    get:
      description: Renders the form to register a new schema version for an existing
        signal type. Requires siteadmin role.
      responses:
        "200":
          description: HTML page
      summary: Register new signal type schema page
      tags:
      - UI Pages
  /admin/signal-types/routing:
    get:
      description: Renders the Signals Routing Rules management page. Requires siteadmin
        role.
      responses:
        "200":
          description: HTML page
      summary: Manage ISN routing page
      tags:
      - UI Pages
  /admin/users/generate-password-reset-link:
    get:
      description: Renders the password reset link generation form. Requires siteadmin
        role.
      responses:
        "200":
          description: HTML page
      summary: Generate password reset link page
      tags:
      - UI Pages
  /dashboard:
    get:
      description: Entry point after login. Requires authentication.
      responses:
        "200":
          description: HTML page
      summary: User dashboard
      tags:
      - UI Pages
  /login:
    get:
      responses:
        "200":
          description: HTML page
      summary: Login page
      tags:
      - UI Pages
    post:
      description: HTMX endpoint. Authenticates the user and sets session cookies.
        On success redirects to /dashboard via HX-Redirect.
      parameters:
      - description: User email
        in: formData
        name: email
        required: true
        type: string
      - description: User password
        in: formData
        name: password
        required: true
        type: string
      responses:
        "200":
          description: HTML partial or HX-Redirect header
      summary: Authenticate user
      tags:
      - HTMX Actions
  /logout:
    post:
      description: Revokes the refresh token, clears session cookies, and redirects
        to /login.
      responses:
        "200":
          description: HX-Redirect header
      summary: Log out
      tags:
      - HTMX Actions
  /register:
    get:
      responses:
        "200":
          description: HTML page
      summary: Registration page
      tags:
      - UI Pages
    post:
      description: Creates a new user account.
      parameters:
      - description: User email
        in: formData
        name: email
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      - description: Confirm password
        in: formData
        name: confirm-password
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Register new user
      tags:
      - HTMX Actions
  /search:
    get:
      description: Renders the signal search page. Requires authentication and at
        least one ISN access permission.
      responses:
        "200":
          description: HTML page
      summary: Search signals page
      tags:
      - UI Pages
  /settings:
    get:
      description: Renders the user account settings page. Requires authentication.
      responses:
        "200":
          description: HTML page
      summary: Account settings page
      tags:
      - UI Pages
  /ui-api/account/password:
    put:
      description: HTMX endpoint. Changes the authenticated user's password.
      parameters:
      - description: Current password
        in: formData
        name: current-password
        required: true
        type: string
      - description: New password
        in: formData
        name: new-password
        required: true
        type: string
      - description: Confirm new password
        in: formData
        name: confirm-password
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Update password
      tags:
      - HTMX Actions
  /ui-api/accounts/isn-admins/manage:
    put:
      description: HTMX endpoint. Grants or revokes the isnadmin role for a user.
        Requires siteadmin role.
      parameters:
      - description: User email
        in: formData
        name: user-email
        required: true
        type: string
      - description: '''grant'' or ''revoke'''
        in: formData
        name: action
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Grant or revoke ISN admin role
      tags:
      - HTMX Actions
  /ui-api/accounts/manage:
    put:
      description: HTMX endpoint. Enables or disables a user or service account. Requires
        siteadmin role.
      parameters:
      - description: '''user'' or ''service-account'''
        in: formData
        name: account-type
        required: true
        type: string
      - description: '''enable'' or ''disable'''
        in: formData
        name: action
        required: true
        type: string
      - description: User email (when account-type is 'user')
        in: formData
        name: user-identifier
        type: string
      - description: Client ID (when account-type is 'service-account')
        in: formData
        name: service-account-identifier
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Enable or disable an account
      tags:
      - HTMX Actions
  /ui-api/accounts/site-admins/manage:
    put:
      description: HTMX endpoint. Grants or revokes the siteadmin role for a user.
        Requires siteadmin role.
      parameters:
      - description: User email
        in: formData
        name: user-email
        required: true
        type: string
      - description: '''grant'' or ''revoke'''
        in: formData
        name: action
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Grant or revoke site admin role
      tags:
      - HTMX Actions
  /ui-api/isn/{isn_slug}/signal-types/{signal_type_slug}/v{sem_ver}/signals/{signal_id}/content:
    get:
      description: Streams the document stored with a document signal from the signalsd
        API to the browser as an attachment. Requires access to the ISN (write-only
        accounts can only download their own documents and the documents correlated
        to their signals).
      parameters:
      - description: ISN slug
        in: path
        name: isn_slug
        required: true
        type: string
      - description: Signal type slug
        in: path
        name: signal_type_slug
        required: true
        type: string
      - description: Semantic version
        in: path
        name: sem_ver
        required: true
        type: string
      - description: Signal ID
        in: path
        name: signal_id
        required: true
        type: string
      - description: 'the version to download (default: the latest version)'
        in: query
        name: version
        type: integer
      - description: '''true'' to download a withdrawn document'
        in: query
        name: include_withdrawn
        type: boolean
      responses:
        "200":
          description: the document
      summary: Download a document
      tags:
      - UI Pages
  /ui-api/isn/{isn_slug}/signal-types/{signal_type_slug}/v{sem_ver}/signals/{signal_id}/correlated-count/{count}:
    get:
      description: HTMX endpoint. Returns a table of signals correlated to the specified
        signal.
      parameters:
      - description: Signal ID
        in: path
        name: signal_id
        required: true
        type: string
      - description: ISN slug
        in: path
        name: isn_slug
        required: true
        type: string
      - description: Signal type slug
        in: path
        name: signal_type_slug
        required: true
        type: string
      - description: Semantic version
        in: path
        name: sem_ver
        required: true
        type: string
      - description: Number of correlated signals already displayed
        in: path
        name: count
        required: true
        type: integer
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Get correlated signals
      tags:
      - HTMX Actions
  /ui-api/isn/accounts/manage:
    put:
      description: HTMX endpoint. Adds or removes a user/service account from an ISN.
        Requires admin rights for at least one ISN (the ISN owner, or a site admin).
      parameters:
      - description: ISN slug
        in: formData
        name: isn-slug
        required: true
        type: string
      - description: '''user'' or ''service-account'''
        in: formData
        name: account-type
        required: true
        type: string
      - description: '''read'', ''write'', ''read-write'', or ''none'' (revokes the
          account''s access)'
        in: formData
        name: permission
        required: true
        type: string
      - description: User email (when account-type is 'user')
        in: formData
        name: user-identifier
        type: string
      - description: Client ID (when account-type is 'service-account')
        in: formData
        name: service-account-identifier
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Manage ISN accounts
      tags:
      - HTMX Actions
  /ui-api/isn/create:
    post:
      description: HTMX endpoint. Creates a new ISN. Requires isnadmin or siteadmin
        role.
      parameters:
      - description: ISN title
        in: formData
        name: title
        required: true
        type: string
      - description: ISN description
        in: formData
        name: detail
        required: true
        type: string
      - description: '''public'' or ''private'''
        in: formData
        name: visibility
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Create ISN
      tags:
      - HTMX Actions
  /ui-api/isn/manage:
    put:
      description: HTMX endpoint. Enables or disables an ISN. Requires isnadmin or
        siteadmin role.
      parameters:
      - description: ISN slug
        in: formData
        name: isn-slug
        required: true
        type: string
      - description: '''enable'' or ''disable'''
        in: formData
        name: action
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Enable or disable an ISN
      tags:
      - HTMX Actions
  /ui-api/isn/signal-types/add:
    post:
      description: HTMX endpoint. Associates a signal type version with an ISN. Requires
        admin rights for at least one ISN (the ISN owner, or a site admin).
      parameters:
      - description: ISN slug
        in: formData
        name: isn-slug
        required: true
        type: string
      - description: Signal type slug
        in: formData
        name: signal-type-slug
        required: true
        type: string
      - description: Semantic version
        in: formData
        name: sem-ver
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Add signal type to ISN
      tags:
      - HTMX Actions
  /ui-api/isn/signal-types/manage:
    put:
      description: HTMX endpoint. Enables or disables a specific signal type version
        within an ISN. Requires admin rights for at least one ISN (the ISN owner,
        or a site admin).
      parameters:
      - description: ISN slug
        in: formData
        name: isn-slug
        required: true
        type: string
      - description: Signal type slug
        in: formData
        name: signal-type-slug
        required: true
        type: string
      - description: Semantic version
        in: formData
        name: sem-ver
        required: true
        type: string
      - description: '''enable'' or ''disable'''
        in: formData
        name: action
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Enable or disable a signal type for an ISN
      tags:
      - HTMX Actions
  /ui-api/isn/transfer-ownership:
    put:
      description: HTMX endpoint. Transfers ownership of an ISN to another user. Requires
        siteadmin role.
      parameters:
      - description: ISN slug
        in: formData
        name: isn-slug
        required: true
        type: string
      - description: Email of the new owner (must be an existing user)
        in: formData
        name: new-owner-email
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Transfer ISN ownership
      tags:
      - HTMX Actions
  /ui-api/options/isn/signal-type-slugs:
    get:
      description: HTMX endpoint. Returns a signal type slug select element scoped
        to the user's token permissions for the selected ISN.
      parameters:
      - description: ISN slug
        example: felixstowe-isn
        in: query
        name: isn-slug
        required: true
        type: string
      - description: Include inactive signal types
        in: query
        name: include-inactive
        type: boolean
      responses:
        "200":
          description: HTML partial
        "400":
          description: empty response
      summary: Signal type slugs dropdown (token-scoped)
      tags:
      - HTMX Actions
  /ui-api/options/isn/signal-type-versions:
    get:
      description: HTMX endpoint. Returns a version select element for a signal type,
        scoped to the selected ISN via the user's token permissions.
      parameters:
      - description: Signal type slug
        example: sample-signal-type
        in: query
        name: signal-type-slug
        required: true
        type: string
      - description: ISN slug
        example: felixstowe-isn
        in: query
        name: isn-slug
        required: true
        type: string
      - description: Include inactive versions
        in: query
        name: include-inactive
        type: boolean
      responses:
        "200":
          description: HTML partial
        "400":
          description: empty response
      summary: Signal type versions dropdown (token-scoped)
      tags:
      - HTMX Actions
  /ui-api/options/signal-type-slugs:
    get:
      description: |-
        HTMX endpoint. Returns a signal type slug select element for admin forms.
        Covers all globally-registered signal types regardless of ISN membership.
      responses:
        "200":
          description: HTML partial
      summary: Signal type slugs dropdown (admin)
      tags:
      - HTMX Actions
  /ui-api/options/signal-type-versions:
    get:
      description: HTMX endpoint. Returns a version select element for a signal type.
        Covers all globally-registered versions.
      parameters:
      - description: Signal type slug
        example: sample-signal-type
        in: query
        name: signal-type-slug
        required: true
        type: string
      responses:
        "200":
          description: HTML partial
        "400":
          description: empty response
      summary: Signal type versions dropdown (admin)
      tags:
      - HTMX Actions
  /ui-api/service-accounts/create:
    post:
      description: HTMX endpoint. Creates a new service account. Requires isnadmin
        or siteadmin role.
      parameters:
      - description: Contact email
        in: formData
        name: email
        required: true
        type: string
      - description: Organization name
        in: formData
        name: organization
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Create service account
      tags:
      - HTMX Actions
  /ui-api/service-accounts/reissue-credentials:
    put:
      description: HTMX endpoint. Issues a new client secret for the selected service
        account. Requires siteadmin role.
      parameters:
      - description: Client ID of the service account
        in: formData
        name: service-account-dropdown
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Reissue service account credentials
      tags:
      - HTMX Actions
  /ui-api/signal-types/create:
    post:
      description: HTMX endpoint. Creates a new signal type at version 1.0.0. Requires
        siteadmin role.
      parameters:
      - description: Signal type title
        in: formData
        name: title
        required: true
        type: string
      - description: Description
        in: formData
        name: detail
        required: true
        type: string
      - description: '''json'', ''event'' or ''document'''
        in: formData
        name: content-kind
        required: true
        type: string
      - description: JSON Schema URL (required for json and event signal types unless
          skip-validation is true, not used for document signal types)
        in: formData
        name: schema-url
        type: string
      - description: Readme URL (ignored when skip-readme is true)
        in: formData
        name: readme-url
        required: true
        type: string
      - description: '''true'' to skip schema validation'
        in: formData
        name: skip-validation
        type: string
      - description: '''true'' to skip readme requirement'
        in: formData
        name: skip-readme
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Create signal type
      tags:
      - HTMX Actions
  /ui-api/signal-types/refresh-schema:
    post:
      description: HTMX endpoint. Fetches the schema of a signal type version again
        from its schema URL, updating it in place. Requires siteadmin role.
      parameters:
      - description: Signal type slug
        in: formData
        name: signal-type-slug
        required: true
        type: string
      - description: Semantic version
        in: formData
        name: sem-ver
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Refresh signal type schema
      tags:
      - HTMX Actions
  /ui-api/signal-types/register-new-schema:
    put:
      description: HTMX endpoint. Registers a new schema version for an existing signal
        type. Requires siteadmin role.
      parameters:
      - description: Signal type slug
        in: formData
        name: signal-type-slug
        required: true
        type: string
      - description: JSON Schema URL
        in: formData
        name: schema-url
        required: true
        type: string
      - description: Readme URL
        in: formData
        name: readme-url
        required: true
        type: string
      - description: Description of changes
        in: formData
        name: detail
        required: true
        type: string
      - description: '''major'', ''minor'', or ''patch'''
        in: formData
        name: bump-type
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Register new signal type schema version
      tags:
      - HTMX Actions
  /ui-api/signal-types/routing:
    delete:
      description: HTMX endpoint. Deletes all routing rules for a signal type version.
      parameters:
      - description: signal type slug
        example: sample-signal-type
        in: formData
        name: signal-type-slug
        required: true
        type: string
      - description: version
        example: 1.0.0
        in: formData
        name: sem-ver
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Delete Signals Routing Rules
      tags:
      - HTMX Actions
    get:
      description: |-
        HTMX endpoint. Renders the routing rule form for the selected signal type version.
        Returns empty 200 if either param is missing (htmx cascade not yet complete).
      parameters:
      - description: signal type slug
        example: sample-signal-type
        in: query
        name: signal-type-slug
        required: true
        type: string
      - description: version
        example: 1.0.0
        in: query
        name: sem-ver
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Load signals routing form
      tags:
      - HTMX Actions
    put:
      description: HTMX endpoint. Saves routing rules for a signal type version.
      parameters:
      - description: signal type slug
        example: sample-signal-type
        in: formData
        name: signal-type-slug
        required: true
        type: string
      - description: version
        example: 1.0.0
        in: formData
        name: sem-ver
        required: true
        type: string
      - description: gjson path to routing field
        example: payload.portOfEntry
        in: formData
        name: routing-field
        required: true
        type: string
      - collectionFormat: csv
        description: match pattern per row
        example: '*felixstowe*'
        in: formData
        items:
          type: string
        name: match-patterns
        required: true
        type: array
      - collectionFormat: csv
        description: operator per row
        in: formData
        items:
          enum:
          - matches
          - equals
          - does_not_match
          - does_not_equal
          type: string
        name: operators
        required: true
        type: array
      - collectionFormat: csv
        description: '''true'' or ''false'' per row'
        in: formData
        items:
          type: string
        name: case-insensitive
        required: true
        type: array
      - collectionFormat: csv
        description: target ISN slug per row
        example: felixstowe-isn
        in: formData
        items:
          type: string
        name: isn-slugs
        required: true
        type: array
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Save Signals Routing Rules
      tags:
      - HTMX Actions
  /ui-api/signal-types/routing/add-row:
    get:
      description: |-
        HTMX endpoint. Returns a new empty mapping row to append to the form table.
        The optional count param is used to set the initial sequence label in the rendered row.
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Add routing mapping row
      tags:
      - HTMX Actions
  /ui-api/signal-types/routing/remove-row:
    get:
      description: HTMX endpoint. Returns empty content; the caller uses hx-swap="outerHTML"
        to remove the row.
      responses:
        "200":
          description: empty
      summary: Remove routing mapping row
      tags:
      - HTMX Actions
  /ui-api/signals/search:
    get:
      description: HTMX endpoint. Returns a table of signals matching the search criteria.
        Requires access to the ISN (write-only accounts only see their own signals
        and the signals correlated to them).
      parameters:
      - description: ISN slug
        in: query
        name: isn-slug
        required: true
        type: string
      - description: Signal type slug
        in: query
        name: signal-type-slug
        required: true
        type: string
      - description: Semantic version
        in: query
        name: sem-ver
        required: true
        type: string
      - description: Start date (ISO 8601)
        in: query
        name: start-date
        type: string
      - description: End date (ISO 8601)
        in: query
        name: end-date
        type: string
      - description: Filter by account ID
        in: query
        name: account-id
        type: string
      - description: Filter by signal ID
        in: query
        name: signal-id
        type: string
      - description: Filter by local reference
        in: query
        name: local-ref
        type: string
      - description: Include withdrawn signals
        in: query
        name: include-withdrawn
        type: boolean
      - description: Include correlated signals
        in: query
        name: include-correlated
        type: boolean
      - description: Include previous schema versions
        in: query
        name: include-previous-versions
        type: boolean
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Search signals
      tags:
      - HTMX Actions
  /ui-api/toggles/content-kind:
    get:
      description: 'HTMX endpoint. Returns the schema fields for the create signal
        type form: the skip validation checkbox and schema URL input for json and
        event signal types, or a note that document signal types have no schema.'
      parameters:
      - description: '''json'', ''event'' or ''document'''
        in: query
        name: content-kind
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Toggle schema fields for the selected content kind
      tags:
      - HTMX Actions
  /ui-api/toggles/skip-readme:
    get:
      description: HTMX endpoint. Returns a readme URL input field, enabled or disabled
        based on the skip-readme flag.
      parameters:
      - description: '''true'' to render the field as disabled'
        in: query
        name: skip-readme
        type: boolean
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Toggle readme URL input
      tags:
      - HTMX Actions
  /ui-api/toggles/skip-validation:
    get:
      description: HTMX endpoint. Returns a schema URL input field, enabled or disabled
        based on the skip-validation flag.
      parameters:
      - description: '''true'' to render the field as disabled'
        in: query
        name: skip-validation
        type: boolean
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Toggle schema validation input
      tags:
      - HTMX Actions
  /ui-api/users/generate-password-reset-link:
    put:
      description: HTMX endpoint. Generates a one-time password reset URL for a user.
        Requires siteadmin role.
      parameters:
      - description: Selected user in 'email|role' format
        in: formData
        name: user-dropdown
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Generate password reset link
      tags:
      - HTMX Actions
produces:
- application/json
securityDefinitions:
  BearerAccessToken:
    description: Bearer {JWT access token}
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Browser-based management interface. Page handlers return full HTML
  name: UI Pages
- description: HTMX action handlers (/ui-api/*) return HTML partials
  name: HTMX Actions
