consumes:
- application/json
info:
  contact: {}
  description: |-
    Signals ISN service API for managing Information Sharing Networks

    ## Common Error Responses
    All endpoints may return:
    - `400` Malformed request (invalid json, missing required fields, etc.)
    - `401` Unauthorized (invalid credentials)
    - `403` Forbidden (insufficient permissions)
    - `404` Resource not found (e.g. an ISN or signal type that doesn't exist or is not in use)
    - `413` Request body exceeds size limit
    - `429` Rate limit exceeded
    - `500` Internal server error
    - `504` Request timed out (`timeout`)

    Individual endpoints document their specific business logic errors.

    Standard error responses include a JSON response body containing `error_code`, `message` and `request_id` fields.

    The /oauth endpoints return `error` (the RFC6749 standard error code), `error_code` and `error_description` fields instead.

    ## Request Limits
    The endpoints are protected by:
    - **Rate limiting**: Configurable requests per second (all endpoints)
    - **Request size limits** (configurable - these are the defaults): 64KB for admin/auth endpoints, 5MB for json and event signal submissions, 20MB for document uploads

    Check the `Signalsd-Max-Request-Size` response header for the configured size limit of the endpoint called.

    The rate limit is set globally and prevents abuse of the service.
    In production there will be additional protections in place such as per-IP rate limiting provided by the load balancer/reverse proxy.

    ## Authentication & Authorization

    ### OAuth
    The signalsd backend service acts as an OAuth 2.0 Authorization Server and supports web users and service accounts.

    ### Authentication Flows
    - **Web users**: (Refresh Token Grant Type) Authentication via /api/auth/login -> receive JWT access token + HTTP-only refresh cookie -> use bearer tokens for API calls
    - **Service accounts**: Clients implement OAuth Client Credentials flow -> receive JWT access token -> use bearer tokens for API calls

    ### Token Usage
    All protected API endpoints require a valid JWT access token in the Authorization header:
    ```
    Authorization: Bearer <jwt-access-token>
    ```

    **Token Refresh (Service Accounts):**
    - Client calls `POST /oauth/token` with `grant_type=client_credentials` in the form body, and the client ID/secret as form fields or HTTP Basic auth
    - API validates credentials and issues new access token
    - Client receives new bearer token for subsequent API calls

    **Login (Web Users):**
    - Client calls `/api/auth/login` with email and password and receives an access token in the response body. The refresh token is set as an HTTP-only cookie.

    **Token Refresh (Web Users):**
    - Client calls `POST /oauth/token` with `grant_type=refresh_token` in the form body (the HTTP-only refresh token cookie is sent automatically)
    - API validates refresh token and issues new access token + rotated refresh cookie
    - Client receives new bearer token for subsequent API calls

    **Token Lifetimes:**
    - Access tokens: 30 minutes
    - Refresh tokens: 30 days (web users only). Each refresh issues a new refresh token valid for another 30 days, so users only need to log in again if they don't use the service for 30 days.

    Each login or refresh revokes the user's other refresh tokens, so a user has one active session at a time.

    The account's role and ISN permissions are included in the access token when it is issued. Changes to them (and disabling an account) take effect when the account next gets an access token - up to 30 minutes later.

    ### CSRF Protection
    The refresh token used by the /oauth API endpoints is stored in an HttpOnly cookie (to prevent access by JavaScript)
    and marked with SameSite=Strict (to prevent it from being sent in cross-site requests, mitigating CSRF).

    ### CORS Protection

    CORS is used to control which browser-based clients can make cross-origin requests to the API and read responses.

    The `ALLOWED_ORIGINS` environment variable is used to configure the CORS rules.

    In production, you should restrict ALLOWED_ORIGINS to trusted client origins (the server will not start if it is not set)

    ## Date/Time Handling

    **URL Parameters**: The following ISO 8601 formats are accepted in URL query parameters:
    - 2006-01-02T15:04:05Z (UTC)
    - 2006-01-02T15:04:05+07:00 (with offset)
    - 2006-01-02T15:04:05.999999999Z (nano precision)
    - 2006-01-02 (date only, treated as start of day UTC: 2006-01-02T00:00:00Z)

    Note: When including a timestamp with a timezone offset in a query parameter, encode the + sign as %2B (e.g. 2025-08-31T12:00:00%2B07:00). Otherwise, + may be interpreted as a space.

    **Response Bodies**: All date/time fields in JSON responses use RFC3339 format (ISO 8601):
    - Example: "2025-06-03T13:47:47.331787+01:00"

    # Signals

    ## Content kinds
    Each signal type has a `content_kind`, which determines how its signals are sent:
    - **json**: JSON content, validated against the signal type's schema. Sent with *Submit Signals* (or *Submit Signals via Router*).
    - **document**: a file (PDF, JPEG, PNG or XML). Sent with *Upload a Document* and retrieved with *Download a Document*. Search results contain the document's metadata, not the file.
    - **event**: an immutable JSON record that a process waypoint has been reached for another signal (e.g. an export health certificate was approved for a consignment). Sent with *Submit Signals* (see Events below).

    Search, withdrawal and batches work the same way for every kind, and search results include each signal's `content_kind`.

    ## Versions and resubmissions
    Each signal is identified by the `local_ref` the sender supplies, which must be unique for the account, ISN and signal type version (sending the same `local_ref` to two ISNs, or to two versions of a signal type, creates two independent signals). When a `local_ref` is sent to the same ISN again:
    - **If something changed**, a new version of the signal is stored (json and document signals).
    - **If nothing changed** (the same content, and the same or no `correlation_id`), nothing is stored. The response contains the `signal_id`, `signal_version_id` and `version_number` of the existing latest version, with `unchanged: true`, so requests can be safely retried. JSON content is compared as JSON (key order and whitespace are ignored). Documents compare the file and its filename.
    - **If the signal was withdrawn**, it is reactivated with a new version (json and document signals).
    - **Events are never changed**: resubmitting an event with different content or a different `correlation_id`, or after it was withdrawn, fails with `resource_already_exists`. To correct an event, withdraw it and send a new event with a new `local_ref`.

    ## Recovering from failures
    Each signal in a request is stored separately, so a request that fails part way through (e.g. a timeout) can leave some signals stored and others not. Because unchanged signals are not stored again, you can recover in either of these ways:
    - **Resend the whole request.** Signals that were already stored are returned with `unchanged: true`, and only the missing or failed signals are stored. Note that any json signal in the request that has been withdrawn since it was sent is reactivated (withdrawn events are not reactivated - they fail with `resource_already_exists`).
    - **Resend only the failures.** The response lists the signals that failed, and *Get Batch Status* lists the batch's unresolved failures.

    When a whole *Submit Signals* request fails (an error response such as 400, 401, 403, 404, 413 or 500), or you get no response, no failures are recorded in the batch, so resend the whole request once the problem is fixed. Rejected document uploads are recorded in the batch (except when the request's form fields are missing or invalid).

    If the server's request timeout is reached part way through a *Submit Signals* request, the remaining signals are returned as `database_error` failures but may not be recorded in the batch - resend the whole request.

    A retry of a json signal or document sent while the original request is still being processed can occasionally store an extra, identical version. This is harmless - the content doesn't change - but pollers will see one more update. To avoid it, set your client timeout above the server's request timeout: 15 seconds by default, or 2 minutes for document uploads.

    ## Correlation
    A signal can be linked to another signal in the same ISN by setting its `correlation_id` to the other signal's `signal_id`. Search with `include_correlated=true` returns the signals linked to each result, and the `correlation_id` search filter returns the signals linked to one signal.

    Search results include each signal's `correlation_id` (null if the signal is not linked to another signal). To fetch the signal it is linked to (e.g. the consignment an event is about), search that signal's type with `signal_id=<correlation_id>`.

    **Correlate to the entity directly.** For example, correlate a consignment's documents and events to the consignment itself, not to each other. Correlation is one level deep: `include_correlated` only returns signals that are correlated directly to the returned signal.

    **Correlating is sharing.** Correlating your signal to a signal created by another account is like emailing that account a copy, with the extra controls that you can withdraw it or send new versions, and they see those changes. Unlike email:
    - withdrawing a signal stops further access through the service
    - if a new version changes the correlation_id, access moves with it: the owner of the newly correlated signal can see every version, and the previous owner can no longer access it through the service

    ## Who can see signals
    - Accounts with **read** access to an ISN can see every signal in it.
    - Accounts with **write-only** access can see the signals they created, and the signals other accounts have correlated to their signals (one level deep).
    - Signals in a **public** ISN can be searched by anyone, using *Signal Search (public ISNs)* (`/api/public/isn/...`). Downloading a document still needs an access token and access to the ISN.

    Privacy between participants is set by the ISN's permissions. For example, in a network where all participants share their data with a government agency but not with each other, the participants are given write-only access and the agency is given read access.

    ## Events
    Event signals record that a process waypoint has been reached - e.g. `ehc-approved` (an export health certificate was approved) or `departed-origin` - for the signal they are correlated to. Each waypoint is its own event signal type, so recipients choose which events they receive by choosing which event types to search or poll.
    - **`correlation_id` is required**: correlate the event to the signal it is about (e.g. the consignment). Requests containing events without one are rejected.
    - **`content` must include `occurred_at`**: the time the waypoint was reached, as an RFC 3339 timestamp with a time zone offset (e.g. `2026-09-27T14:02:00Z`).
    - **`subject`**: if the event is about a specific version of a signal (e.g. version 3 of a document), name it in a `subject` field in `content`: `{"signal_id": "...", "version": 3}`. Always include the version - later versions of the document may be different.
    - **Events are immutable** (see Versions and resubmissions).
    - The service doesn't enforce an order: events are accepted in any order and can repeat (e.g. several inspections). To build a timeline, order a signal's correlated events by `occurred_at`.

    Example: `{"local_ref": "ehc-approved-001", "correlation_id": "<consignment signal_id>", "content": {"occurred_at": "2026-09-27T14:02:00Z", "subject": {"signal_id": "<document signal_id>", "version": 3}, "certificate_no": "EHC-001"}}`

    **Schemas for event types.** An event type's schema validates the event's `content`, as for json signal types, but:
    - the service checks `occurred_at` whatever the schema says. The schema must still allow it: declare `occurred_at` (and `subject`, if the type has one) and list it as required, especially if the schema uses `"additionalProperties": false`
    - `occurred_at` and `subject` are reserved - don't use them for anything else
    - the service doesn't check `subject` yet, so a type whose events have a subject should require it in its schema, as `{"signal_id": <uuid>, "version": <integer>}`

    ## Polling for changes
    To find out about new and changed signals, poll *Signal Search* for each signal type you are interested in:
    ```
    GET /api/isn/{isn_slug}/signal-types/{signal_type_slug}/v{sem_ver}/signals/search?updated_since={cursor}&include_withdrawn=true
    ```
    - `updated_since` returns the signals that were created, given a new version, recorrelated or withdrawn since that time. Results are ordered by `signal_updated_at`, so the last result's `signal_updated_at` is your cursor.
    - Use `include_withdrawn=true`, so withdrawn signals are returned with `is_withdrawn: true` (otherwise they silently drop out of the results).
    - **Polling is at-least-once, so overlap your polls**: set `updated_since` to 1 minute before your cursor, and skip the results you have already seen (the same `signal_id` and `signal_updated_at`).
    - Why the overlap is needed: `signal_updated_at` is set when the service starts storing a signal, not when it finishes. A signal that was still being stored when you last polled can therefore appear with a `signal_updated_at` a little before your cursor. The 1 minute overlap makes sure your next poll picks it up.
    - Search results are not paginated, so poll often enough to keep each result set small.

    # UI Endpoints

    UI endpoints serve the browser-based management interface.

    ## Route types
    - **Page handlers** (`GET /admin/*`, `/search`, etc.): return a full HTML page (`200`)
    - **HTMX action handlers** (`/ui-api/*`): return an HTML partial (`200`) - either the requested content, or a success or error alert fragment

    - see /ui-docs for more information

    ## Auth
    All protected routes require a valid session (cookie-based). Unauthenticated requests redirect to `/login`.
    Requests with insufficient role are redirected to `/access-denied`.

    ## Role requirements
    - **Public** (`/login`, `/register`): no authentication required
    - **Authenticated**: any logged-in user (`/dashboard`, `/settings`, and `/search` for accounts with access to an ISN)
    - **`isnadmin` or `siteadmin`**: the admin dashboard, ISN creation, enabling and disabling ISNs, service account creation
    - **Admins of at least one ISN**: ISN access, the ISN's signal types, viewing signal type configuration
    - **`siteadmin` only**: account management (enabling and disabling accounts, password reset links, reissuing service account credentials), ISN ownership transfer, role management, signal type creation and schemas, signal routing rules
  license:
    name: MIT
  title: Signals ISN API
paths:
  /admin:
    get:
      description: Admin landing page. Requires isnadmin or siteadmin role. The site
        admin only features are not shown to ISN admins.
      responses:
        "200":
          description: HTML page
      summary: Admin dashboard
      tags:
      - UI Pages
  /admin/accounts/isn-admins/manage:
    get:
      description: Renders the ISN admin role management form. Requires siteadmin
        role.
      responses:
        "200":
          description: HTML page
      summary: Manage ISN admin roles page
      tags:
      - UI Pages
  /admin/accounts/manage:
    get:
      description: Renders the account enable/disable form for users and service accounts.
        Requires siteadmin role.
      responses:
        "200":
          description: HTML page
      summary: Manage account status page
      tags:
      - UI Pages
  /admin/accounts/site-admins/manage:
    get:
      description: Renders the site admin role management form. Requires siteadmin
        role.
      responses:
        "200":
          description: HTML page
      summary: Manage site admin roles page
      tags:
      - UI Pages
  /admin/isn/accounts/manage:
    get:
      description: Renders the ISN accounts management page. Requires admin rights
        for at least one ISN (the ISN owner, or a site admin).
      responses:
        "200":
          description: HTML page
      summary: Manage ISN accounts page
      tags:
      - UI Pages
  /admin/isn/create:
    get:
      description: Renders the create ISN form. Requires isnadmin or siteadmin role.
      responses:
        "200":
          description: HTML page
      summary: Create ISN page
      tags:
      - UI Pages
  /admin/isn/manage:
    get:
      description: Renders the ISN enable/disable page. Only shows ISNs the user administers.
        Requires isnadmin or siteadmin role.
      responses:
        "200":
          description: HTML page
      summary: Manage ISN status page
      tags:
      - UI Pages
  /admin/isn/signal-types/add:
    get:
      description: Renders the form to associate a signal type version with an ISN.
        Requires admin rights for at least one ISN (the ISN owner, or a site admin).
      responses:
        "200":
          description: HTML page
      summary: Add signal type to ISN page
      tags:
      - UI Pages
  /admin/isn/signal-types/manage:
    get:
      description: Renders the form to enable or disable signal types within an ISN.
        Requires admin rights for at least one ISN (the ISN owner, or a site admin).
      responses:
        "200":
          description: HTML page
      summary: Manage ISN signal type status page
      tags:
      - UI Pages
  /admin/isn/transfer-ownership:
    get:
      description: Renders the ISN ownership transfer page. Requires siteadmin role.
      responses:
        "200":
          description: HTML page
      summary: Transfer ISN ownership page
      tags:
      - UI Pages
  /admin/service-accounts/create:
    get:
      description: Renders the create service account form. Requires isnadmin or siteadmin
        role.
      responses:
        "200":
          description: HTML page
      summary: Create service account page
      tags:
      - UI Pages
  /admin/service-accounts/reissue-credentials:
    get:
      description: Renders the reissue credentials form. Requires siteadmin role.
      responses:
        "200":
          description: HTML page
      summary: Reissue service account credentials page
      tags:
      - UI Pages
  /admin/signal-types/create:
    get:
      description: Renders the create signal type form. Requires siteadmin role.
      responses:
        "200":
          description: HTML page
      summary: Create signal type page
      tags:
      - UI Pages
  /admin/signal-types/list:
    get:
      description: Renders a read-only report of all registered signal types. Requires
        admin rights for at least one ISN (the ISN owner, or a site admin).
      responses:
        "200":
          description: HTML page
      summary: List signal types page
      tags:
      - UI Pages
  /admin/signal-types/register-new-schema:
    get:
      description: Renders the form to register a new schema version for an existing
        signal type. Requires siteadmin role.
      responses:
        "200":
          description: HTML page
      summary: Register new signal type schema page
      tags:
      - UI Pages
  /admin/signal-types/routing:
    get:
      description: Renders the Signals Routing Rules management page. Requires siteadmin
        role.
      responses:
        "200":
          description: HTML page
      summary: Manage ISN routing page
      tags:
      - UI Pages
  /admin/users/generate-password-reset-link:
    get:
      description: Renders the password reset link generation form. Requires siteadmin
        role.
      responses:
        "200":
          description: HTML page
      summary: Generate password reset link page
      tags:
      - UI Pages
  /dashboard:
    get:
      description: Entry point after login. Requires authentication.
      responses:
        "200":
          description: HTML page
      summary: User dashboard
      tags:
      - UI Pages
  /login:
    get:
      responses:
        "200":
          description: HTML page
      summary: Login page
      tags:
      - UI Pages
    post:
      description: HTMX endpoint. Authenticates the user and sets session cookies.
        On success redirects to /dashboard via HX-Redirect.
      parameters:
      - description: User email
        in: formData
        name: email
        required: true
        type: string
      - description: User password
        in: formData
        name: password
        required: true
        type: string
      responses:
        "200":
          description: HTML partial or HX-Redirect header
      summary: Authenticate user
      tags:
      - HTMX Actions
  /logout:
    post:
      description: Revokes the refresh token, clears session cookies, and redirects
        to /login.
      responses:
        "200":
          description: HX-Redirect header
      summary: Log out
      tags:
      - HTMX Actions
  /register:
    get:
      responses:
        "200":
          description: HTML page
      summary: Registration page
      tags:
      - UI Pages
    post:
      description: Creates a new user account.
      parameters:
      - description: User email
        in: formData
        name: email
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      - description: Confirm password
        in: formData
        name: confirm-password
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Register new user
      tags:
      - HTMX Actions
  /search:
    get:
      description: Renders the signal search page. Requires authentication and at
        least one ISN access permission.
      responses:
        "200":
          description: HTML page
      summary: Search signals page
      tags:
      - UI Pages
  /settings:
    get:
      description: Renders the user account settings page. Requires authentication.
      responses:
        "200":
          description: HTML page
      summary: Account settings page
      tags:
      - UI Pages
  /ui-api/account/password:
    put:
      description: HTMX endpoint. Changes the authenticated user's password.
      parameters:
      - description: Current password
        in: formData
        name: current-password
        required: true
        type: string
      - description: New password
        in: formData
        name: new-password
        required: true
        type: string
      - description: Confirm new password
        in: formData
        name: confirm-password
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Update password
      tags:
      - HTMX Actions
  /ui-api/accounts/isn-admins/manage:
    put:
      description: HTMX endpoint. Grants or revokes the isnadmin role for a user.
        Requires siteadmin role.
      parameters:
      - description: User email
        in: formData
        name: user-email
        required: true
        type: string
      - description: '''grant'' or ''revoke'''
        in: formData
        name: action
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Grant or revoke ISN admin role
      tags:
      - HTMX Actions
  /ui-api/accounts/manage:
    put:
      description: HTMX endpoint. Enables or disables a user or service account. Requires
        siteadmin role.
      parameters:
      - description: '''user'' or ''service-account'''
        in: formData
        name: account-type
        required: true
        type: string
      - description: '''enable'' or ''disable'''
        in: formData
        name: action
        required: true
        type: string
      - description: User email (when account-type is 'user')
        in: formData
        name: user-identifier
        type: string
      - description: Client ID (when account-type is 'service-account')
        in: formData
        name: service-account-identifier
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Enable or disable an account
      tags:
      - HTMX Actions
  /ui-api/accounts/site-admins/manage:
    put:
      description: HTMX endpoint. Grants or revokes the siteadmin role for a user.
        Requires siteadmin role.
      parameters:
      - description: User email
        in: formData
        name: user-email
        required: true
        type: string
      - description: '''grant'' or ''revoke'''
        in: formData
        name: action
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Grant or revoke site admin role
      tags:
      - HTMX Actions
  /ui-api/isn/{isn_slug}/signal-types/{signal_type_slug}/v{sem_ver}/signals/{signal_id}/content:
    get:
      description: Streams the document stored with a document signal from the signalsd
        API to the browser as an attachment. Requires access to the ISN (write-only
        accounts can only download their own documents and the documents correlated
        to their signals).
      parameters:
      - description: ISN slug
        in: path
        name: isn_slug
        required: true
        type: string
      - description: Signal type slug
        in: path
        name: signal_type_slug
        required: true
        type: string
      - description: Semantic version
        in: path
        name: sem_ver
        required: true
        type: string
      - description: Signal ID
        in: path
        name: signal_id
        required: true
        type: string
      - description: 'the version to download (default: the latest version)'
        in: query
        name: version
        type: integer
      - description: '''true'' to download a withdrawn document'
        in: query
        name: include_withdrawn
        type: boolean
      responses:
        "200":
          description: the document
      summary: Download a document
      tags:
      - UI Pages
  /ui-api/isn/{isn_slug}/signal-types/{signal_type_slug}/v{sem_ver}/signals/{signal_id}/correlated-count/{count}:
    get:
      description: HTMX endpoint. Returns a table of signals correlated to the specified
        signal.
      parameters:
      - description: Signal ID
        in: path
        name: signal_id
        required: true
        type: string
      - description: ISN slug
        in: path
        name: isn_slug
        required: true
        type: string
      - description: Signal type slug
        in: path
        name: signal_type_slug
        required: true
        type: string
      - description: Semantic version
        in: path
        name: sem_ver
        required: true
        type: string
      - description: Number of correlated signals already displayed
        in: path
        name: count
        required: true
        type: integer
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Get correlated signals
      tags:
      - HTMX Actions
  /ui-api/isn/accounts/manage:
    put:
      description: HTMX endpoint. Adds or removes a user/service account from an ISN.
        Requires admin rights for at least one ISN (the ISN owner, or a site admin).
      parameters:
      - description: ISN slug
        in: formData
        name: isn-slug
        required: true
        type: string
      - description: '''user'' or ''service-account'''
        in: formData
        name: account-type
        required: true
        type: string
      - description: '''read'', ''write'', ''read-write'', or ''none'' (revokes the
          account''s access)'
        in: formData
        name: permission
        required: true
        type: string
      - description: User email (when account-type is 'user')
        in: formData
        name: user-identifier
        type: string
      - description: Client ID (when account-type is 'service-account')
        in: formData
        name: service-account-identifier
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Manage ISN accounts
      tags:
      - HTMX Actions
  /ui-api/isn/create:
    post:
      description: HTMX endpoint. Creates a new ISN. Requires isnadmin or siteadmin
        role.
      parameters:
      - description: ISN title
        in: formData
        name: title
        required: true
        type: string
      - description: ISN description
        in: formData
        name: detail
        required: true
        type: string
      - description: '''public'' or ''private'''
        in: formData
        name: visibility
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Create ISN
      tags:
      - HTMX Actions
  /ui-api/isn/manage:
    put:
      description: HTMX endpoint. Enables or disables an ISN. Requires isnadmin or
        siteadmin role.
      parameters:
      - description: ISN slug
        in: formData
        name: isn-slug
        required: true
        type: string
      - description: '''enable'' or ''disable'''
        in: formData
        name: action
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Enable or disable an ISN
      tags:
      - HTMX Actions
  /ui-api/isn/signal-types/add:
    post:
      description: HTMX endpoint. Associates a signal type version with an ISN. Requires
        admin rights for at least one ISN (the ISN owner, or a site admin).
      parameters:
      - description: ISN slug
        in: formData
        name: isn-slug
        required: true
        type: string
      - description: Signal type slug
        in: formData
        name: signal-type-slug
        required: true
        type: string
      - description: Semantic version
        in: formData
        name: sem-ver
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Add signal type to ISN
      tags:
      - HTMX Actions
  /ui-api/isn/signal-types/manage:
    put:
      description: HTMX endpoint. Enables or disables a specific signal type version
        within an ISN. Requires admin rights for at least one ISN (the ISN owner,
        or a site admin).
      parameters:
      - description: ISN slug
        in: formData
        name: isn-slug
        required: true
        type: string
      - description: Signal type slug
        in: formData
        name: signal-type-slug
        required: true
        type: string
      - description: Semantic version
        in: formData
        name: sem-ver
        required: true
        type: string
      - description: '''enable'' or ''disable'''
        in: formData
        name: action
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Enable or disable a signal type for an ISN
      tags:
      - HTMX Actions
  /ui-api/isn/transfer-ownership:
    put:
      description: HTMX endpoint. Transfers ownership of an ISN to another user. Requires
        siteadmin role.
      parameters:
      - description: ISN slug
        in: formData
        name: isn-slug
        required: true
        type: string
      - description: Email of the new owner (must be an existing user)
        in: formData
        name: new-owner-email
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Transfer ISN ownership
      tags:
      - HTMX Actions
  /ui-api/options/isn/signal-type-slugs:
    get:
      description: HTMX endpoint. Returns a signal type slug select element scoped
        to the user's token permissions for the selected ISN.
      parameters:
      - description: ISN slug
        example: felixstowe-isn
        in: query
        name: isn-slug
        required: true
        type: string
      - description: Include inactive signal types
        in: query
        name: include_inactive
        type: boolean
      responses:
        "200":
          description: HTML partial
        "400":
          description: empty response
      summary: Signal type slugs dropdown (token-scoped)
      tags:
      - HTMX Actions
  /ui-api/options/isn/signal-type-versions:
    get:
      description: HTMX endpoint. Returns a version select element for a signal type,
        scoped to the selected ISN via the user's token permissions.
      parameters:
      - description: Signal type slug
        example: sample-signal-type
        in: query
        name: signal-type-slug
        required: true
        type: string
      - description: ISN slug
        example: felixstowe-isn
        in: query
        name: isn-slug
        required: true
        type: string
      - description: Include inactive versions
        in: query
        name: include_inactive
        type: boolean
      responses:
        "200":
          description: HTML partial
        "400":
          description: empty response
      summary: Signal type versions dropdown (token-scoped)
      tags:
      - HTMX Actions
  /ui-api/options/signal-type-slugs:
    get:
      description: |-
        HTMX endpoint. Returns a signal type slug select element for admin forms.
        Covers all globally-registered signal types regardless of ISN membership.
      responses:
        "200":
          description: HTML partial
      summary: Signal type slugs dropdown (admin)
      tags:
      - HTMX Actions
  /ui-api/options/signal-type-versions:
    get:
      description: HTMX endpoint. Returns a version select element for a signal type.
        Covers all globally-registered versions.
      parameters:
      - description: Signal type slug
        example: sample-signal-type
        in: query
        name: signal-type-slug
        required: true
        type: string
      responses:
        "200":
          description: HTML partial
        "400":
          description: empty response
      summary: Signal type versions dropdown (admin)
      tags:
      - HTMX Actions
  /ui-api/service-accounts/create:
    post:
      description: HTMX endpoint. Creates a new service account. Requires isnadmin
        or siteadmin role.
      parameters:
      - description: Contact email
        in: formData
        name: email
        required: true
        type: string
      - description: Organization name
        in: formData
        name: organization
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Create service account
      tags:
      - HTMX Actions
  /ui-api/service-accounts/reissue-credentials:
    put:
      description: HTMX endpoint. Issues a new client secret for the selected service
        account. Requires siteadmin role.
      parameters:
      - description: Client ID of the service account
        in: formData
        name: service-account-dropdown
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Reissue service account credentials
      tags:
      - HTMX Actions
  /ui-api/signal-types/create:
    post:
      description: HTMX endpoint. Creates a new signal type at version 1.0.0. Requires
        siteadmin role.
      parameters:
      - description: Signal type title
        in: formData
        name: title
        required: true
        type: string
      - description: Description
        in: formData
        name: detail
        required: true
        type: string
      - description: '''json'', ''event'' or ''document'''
        in: formData
        name: content-kind
        required: true
        type: string
      - description: JSON Schema URL (required for json and event signal types unless
          skip-validation is true, not used for document signal types)
        in: formData
        name: schema-url
        type: string
      - description: Readme URL (ignored when skip-readme is true)
        in: formData
        name: readme-url
        required: true
        type: string
      - description: '''true'' to skip schema validation'
        in: formData
        name: skip-validation
        type: string
      - description: '''true'' to skip readme requirement'
        in: formData
        name: skip-readme
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Create signal type
      tags:
      - HTMX Actions
  /ui-api/signal-types/register-new-schema:
    put:
      description: HTMX endpoint. Registers a new schema version for an existing signal
        type. Requires siteadmin role.
      parameters:
      - description: Signal type slug
        in: formData
        name: signal-type-slug
        required: true
        type: string
      - description: JSON Schema URL
        in: formData
        name: schema-url
        required: true
        type: string
      - description: Readme URL
        in: formData
        name: readme-url
        required: true
        type: string
      - description: Description of changes
        in: formData
        name: detail
        required: true
        type: string
      - description: '''major'', ''minor'', or ''patch'''
        in: formData
        name: bump-type
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Register new signal type schema version
      tags:
      - HTMX Actions
  /ui-api/signal-types/routing:
    delete:
      description: HTMX endpoint. Deletes all routing rules for a signal type version.
      parameters:
      - description: signal type slug
        example: sample-signal-type
        in: formData
        name: signal-type-slug
        required: true
        type: string
      - description: version
        example: 1.0.0
        in: formData
        name: sem-ver
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Delete Signals Routing Rules
      tags:
      - HTMX Actions
    get:
      description: |-
        HTMX endpoint. Renders the routing rule form for the selected signal type version.
        Returns empty 200 if either param is missing (htmx cascade not yet complete).
      parameters:
      - description: signal type slug
        example: sample-signal-type
        in: query
        name: signal-type-slug
        required: true
        type: string
      - description: version
        example: 1.0.0
        in: query
        name: sem-ver
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Load signals routing form
      tags:
      - HTMX Actions
    put:
      description: HTMX endpoint. Saves routing rules for a signal type version.
      parameters:
      - description: signal type slug
        example: sample-signal-type
        in: formData
        name: signal-type-slug
        required: true
        type: string
      - description: version
        example: 1.0.0
        in: formData
        name: sem-ver
        required: true
        type: string
      - description: gjson path to routing field
        example: payload.portOfEntry
        in: formData
        name: routing-field
        required: true
        type: string
      - collectionFormat: csv
        description: match pattern per row
        example: '*felixstowe*'
        in: formData
        items:
          type: string
        name: match-patterns
        required: true
        type: array
      - collectionFormat: csv
        description: operator per row
        in: formData
        items:
          enum:
          - matches
          - equals
          - does_not_match
          - does_not_equal
          type: string
        name: operators
        required: true
        type: array
      - collectionFormat: csv
        description: '''true'' or ''false'' per row'
        in: formData
        items:
          type: string
        name: case-insensitive
        required: true
        type: array
      - collectionFormat: csv
        description: target ISN slug per row
        example: felixstowe-isn
        in: formData
        items:
          type: string
        name: isn-slugs
        required: true
        type: array
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Save Signals Routing Rules
      tags:
      - HTMX Actions
  /ui-api/signal-types/routing/add-row:
    get:
      description: |-
        HTMX endpoint. Returns a new empty mapping row to append to the form table.
        The optional count param is used to set the initial sequence label in the rendered row.
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Add routing mapping row
      tags:
      - HTMX Actions
  /ui-api/signal-types/routing/remove-row:
    get:
      description: HTMX endpoint. Returns empty content; the caller uses hx-swap="outerHTML"
        to remove the row.
      responses:
        "200":
          description: empty
      summary: Remove routing mapping row
      tags:
      - HTMX Actions
  /ui-api/signals/search:
    get:
      description: HTMX endpoint. Returns a table of signals matching the search criteria.
        Requires access to the ISN (write-only accounts only see their own signals
        and the signals correlated to them).
      parameters:
      - description: ISN slug
        in: query
        name: isn-slug
        required: true
        type: string
      - description: Signal type slug
        in: query
        name: signal-type-slug
        required: true
        type: string
      - description: Semantic version
        in: query
        name: sem-ver
        required: true
        type: string
      - description: Start date (ISO 8601)
        in: query
        name: start-date
        type: string
      - description: End date (ISO 8601)
        in: query
        name: end-date
        type: string
      - description: Filter by account ID
        in: query
        name: account-id
        type: string
      - description: Filter by signal ID
        in: query
        name: signal-id
        type: string
      - description: Filter by local reference
        in: query
        name: local-ref
        type: string
      - description: Include withdrawn signals
        in: query
        name: include-withdrawn
        type: boolean
      - description: Include correlated signals
        in: query
        name: include-correlated
        type: boolean
      - description: Include previous schema versions
        in: query
        name: include-previous-versions
        type: boolean
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Search signals
      tags:
      - HTMX Actions
  /ui-api/toggles/content-kind:
    get:
      description: 'HTMX endpoint. Returns the schema fields for the create signal
        type form: the skip validation checkbox and schema URL input for json and
        event signal types, or a note that document signal types have no schema.'
      parameters:
      - description: '''json'', ''event'' or ''document'''
        in: query
        name: content-kind
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Toggle schema fields for the selected content kind
      tags:
      - HTMX Actions
  /ui-api/toggles/skip-readme:
    get:
      description: HTMX endpoint. Returns a readme URL input field, enabled or disabled
        based on the skip-readme flag.
      parameters:
      - description: '''true'' to render the field as disabled'
        in: query
        name: skip-readme
        type: boolean
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Toggle readme URL input
      tags:
      - HTMX Actions
  /ui-api/toggles/skip-validation:
    get:
      description: HTMX endpoint. Returns a schema URL input field, enabled or disabled
        based on the skip-validation flag.
      parameters:
      - description: '''true'' to render the field as disabled'
        in: query
        name: skip-validation
        type: boolean
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Toggle schema validation input
      tags:
      - HTMX Actions
  /ui-api/users/generate-password-reset-link:
    put:
      description: HTMX endpoint. Generates a one-time password reset URL for a user.
        Requires siteadmin role.
      parameters:
      - description: Selected user in 'email|role' format
        in: formData
        name: user-dropdown
        required: true
        type: string
      responses:
        "200":
          description: HTML partial (or an error alert)
      summary: Generate password reset link
      tags:
      - HTMX Actions
produces:
- application/json
securityDefinitions:
  BearerAccessToken:
    description: Bearer {JWT access token}
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Browser-based management interface. Page handlers return full HTML
  name: UI Pages
- description: HTMX action handlers (/ui-api/*) return HTML partials
  name: HTMX Actions
