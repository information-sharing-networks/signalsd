# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # app/tools is a separate module for the go tools (sqlc, goose, staticcheck etc), so their
  # dependencies stay out of app/go.mod. Both modules are in one entry so that the templ group can
  # update templ in both in a single PR: the templ cli (app/tools) must match the templ runtime (app).
  - package-ecosystem: "gomod"
    directories:
      - "/app"
      - "/app/tools"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      templ:
        patterns:
          - "github.com/a-h/templ"
        group-by: dependency-name
      golang-x:
        patterns:
          - "golang.org/x/*"
      dependencies:
        patterns:
          - "*"

  # base image of the production image (app/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      include: "scope"
